  fieldSetHint: Select all that apply
  details:
    summary: If you have a ‘share of freehold’
    paragraph:
      one: A ‘share of freehold’ can be an arrangement for owning a flat.
      two: 'It means you own:'
    bullet:
      one: the leasehold for your flat
      two: part of the entire building’s freehold
    selectBoth:
      beforeFreehold: If this is how you own your property, select both
      freehold: freehold
      and: and
      leasehold: leasehold
      afterLeasehold: .
  checkbox:
    freehold:
      label: Freehold
      hint: Own the property and land indefinitely
    leasehold:
      label: Leasehold
      hint: Have a lease with a freeholder (includes most flats)
  error:

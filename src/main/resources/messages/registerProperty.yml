ownsProperty:
  fieldSetHeading: Do you own this property?
  fieldSetHint: This helps us understand if there’s anyone else who’s responsible for the property’s condition
  radios:
    option:
      'yes':
        hint: Includes freehold and leasehold
      'no':
        hint: Includes ‘rent-to-rent’ and ‘guaranteed rent’ arrangements
    error:
      missing: Select if you own this property
ownershipKind:

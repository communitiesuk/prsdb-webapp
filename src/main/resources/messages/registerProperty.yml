heading: Register a property
intro:
  paragraph: 'You’ll need to know:'
  bullet:
    one: 'basic information about the property, like whether it’s a house or flat'
    two: 'details about the property’s rental licence, if it has one'
certificates:
  paragraph:
    one: We’ll ask for gas safety, electrical safety and energy performance certificates. You can register without these certificates, but you must provide them later.
    two: Check the information you add is accurate and up to date.
ifOccupied:
  heading: If your property is occupied
  paragraph: 'We’ll ask for further details, like:'
  bullet:
    one: how many people live in the property
    two: the rent you charge
provideTenancyDetailsLater:
  heading: Provide tenancy details later
  paragraph:
    one: You can continue and submit your registration now, but you’ll need to return later and provide details about the current tenancy.
  whenToProvide:
    heading: When you’ll need to provide these tenancy details
    insetText: To keep your property registered, you must provide its tenancy details within 28 days.
    paragraph: This is because you’ve told us this property’s occupied by tenants.
  reason: 'We’ll need to know:'
  weWillNeedToKnow:
    bullet:
      one: how many people are living in the property
      two: if you’ve provided furniture
      three: how much the rent is
afterRegistered:
  heading: After you’ve registered
  paragraph:
    one: 'You’ll get a <strong>Property Registration Number</strong>.'
    two: You must put this number on any adverts to rent this property, along with each landlord’s Landlord Registration Number.
  insetText: You need to keep your property’s registration up to date.
confirmation:
  banner:
    heading: Property registered
  prn:
    label: 'Your <strong>Property Registration Number</strong> is:'
  keepNumber: We’ve sent you a confirmation email including this number.
  useInAdverts: Use this Property Registration Number when advertising this property, alongside each landlord’s Landlord Registration Number.
  paymentSummary:
    heading: Payment summary
    payment: Payment
    paymentDate: Payment date
    renewalDate: Renewal date
  whatYouNeedToDoNext:
    heading: What you need to do next
    uploadCompliance:
      heading: Upload compliance certificates
      paragraph: 'To keep this property registered, upload its certificates <strong>before {0}</strong>.'
  whatHappensNext:
    heading: What happens next
    lettingAgent:
      subHeading: Your letting agent or property manager needs to provide the remaining required details
      emailedParagraph: "We’ve now emailed your letting agent or property manager and asked them to provide:"
      licensingDetails: licensing details
      gasSafetyCertificate: gas safety certificate
      electricalSafetyCertificate: electrical safety certificate
      epc: energy performance certificate (EPC)
      tenancyDetails: tenancy details
      completeByParagraph: To keep the property registered, they must provide these details before {0}. We’ll notify you when they’ve provided this information.
  provideMissingDetails:
    heading: Providing missing details
    paragraph:
        one: 'You still need to provide the:'
        two: To keep the property registered, provide these details before {0}.
    licensingDetails: licensing details
    gasSafetyCertificate: gas safety certificate
    electricalSafetyCertificate: electrical safety certificate
    epc: energy performance certificate (EPC)
    tenancyDetails: tenancy details
  goToDashboard: Go to dashboard
  feedback:
    body: 'Answer a few short questions about <strong>property registration</strong>.'
taskList:
  heading: Register a rental property
  subtitle: Your answers are saved as you go. You can return and finish this later.
  gasSafety: Gas safety certificate
  electricalSafety: Electrical safety certificate
  epc: Energy performance certificate (EPC)
  aboutYourProperty:
    heading: About your property
    propertyDetails: Property details
    # TODO: PDJB-2016: Remove the ownershipAndLandlords header, it is replaced by peopleResponsible
    ownershipAndLandlords: Ownership and landlords
    peopleResponsible: People responsible for this property
    correspondence: Who the council should contact
    occupied: Tell us if your property’s occupied
  rentedOut:
    heading: How your property’s rented out
    whoProvidesDetails: Who will provide these details
    whoProvidesDetailsOccupiedHint: If you’re using a letting agent or property manager, they can provide the rest of this section
    whoProvidesDetailsNotRequiredHint: Once your property’s occupied, your letting agent or property manager can keep these details updated for you
    licensing: Tell us if your property needs a license
    tenancyDetails: Tenancy details
    tenancyDetailsNotNeededYetHint: Once your property’s occupied, you’ll need to provide details about the tenancy
    lettingAgentProvidesHint: The letting agent will provide these details
  submitYourRegistration:
    heading: Submit your registration
    headingWithPayment: Submit and pay
  checkAndSubmit:
    checkAnswers: Check and submit your answers
    checkAnswersWithPayment: Submit and pay
    addAnotherProperty: Add another property
    payForYourProperties: Pay for your properties
deleteIncompleteProperties:
  areYouSure:
    heading: 'Are you sure you want to delete {0,,address} from the database?'
    radios:
      error:
        missing: Select whether you want to delete this property from the database
  confirmation:
    banner:
      heading: You have deleted an incomplete property
    paragraph:
      one: You have deleted an incomplete property from the database.
      two: 'If you want to register the property, you will need to add any details about the property again.'
    button:
      text: Return to incomplete properties
submitRegistration: Submit registration
confirmMissingCompliance:
  heading: Confirm missing compliance certificates
  warning: You can be fined or prosecuted for not having these certificates.
  intro: This property is occupied by tenants, but it’s missing compliance certificates. These certificates keep tenants safe and are required by law.
  gas:
    heading: Missing valid gas safety certificate
    paragraph: A valid gas safety certificate shows that a Gas Safe engineer has checked the gas supply and appliances within the last 12 months.
    withoutCertificate: 'Without this certificate, you can be:'
    bullet:
      one: fined an unlimited amount
      two: sent to prison
  electrical:
    heading: Missing valid electrical safety certificate
    paragraph: A valid electrical safety certificate shows that an electrician has checked the electrics in the last 5 years.
    withoutCertificate: 'Without this certificate, you can be:'
    bullet:
      one: fined or prosecuted
      two: ordered to fix electrical problems
  epc:
    heading: Missing valid EPC
    paragraph: A valid EPC shows that the property meets the minimum energy efficiency standards for rental properties.
    withoutCertificate: 'Without this certificate, you can be:'
    bullet:
      one: fined or prosecuted
      two: unable to use grounds for possession to evict a tenant
  areYouSure:
    heading: Are you sure you want to submit this registration?
    hint: The local council will be able to see that certificates are missing
  radios:
    'yes': Yes (at risk of prosecution or fine)
    'no': 'No, go back'
    error:
      missing: Select whether you want to submit this registration
  button: Confirm and submit
provideLicensingLater:
  occupied:
    heading: Provide details about property licensing later
    paragraph:
      one: You can continue and submit your registration now, but you’ll need to return later and provide details about this property’s license.
    whenToAdd:
      heading: When you must do this by
      insetText: To keep your property registered, you must provide its licensing details within 28 days.
      paragraph: This is because you’ve told us this property’s occupied by tenants.
  unoccupied:
    heading: Provide details about property licensing later
    paragraph:
      one: If you’re unsure, check with the local council if your property needs a license to be rented out.
    whenToAdd:
      heading: When you’ll need to provide these property licensing details
      paragraph:
        one: You can continue to finish your registration and get a Property Registration Number.
        two: 'Once your property’s occupied, you have 28 days to return and tell us:'
  weWillNeedToKnow:
    intro: 'We’ll need to know:'
    bullet:
      one: if your property needs a license or not
      two: details about the license (if your property needs one)
correspondenceEmail:
  heading: Where should the council send emails?
  hint: This is the email address the council will use if they need to contact someone about the property
  radios:
    error:
      missing: Select which email address the council should send emails to
    option:
      accountEmail:
        label: The email address from my account
      differentEmail:
        label: A different email address (must belong to you or another landlord)
        input:
          label: Email address
          error:
            missing: Enter an email address
            invalidFormat: Enter an email address in the correct format, like name@example.com
propertyManager:
  usingPropertyManager:
    heading: Property manager
    paragraph: 'Tell us if you use a person or company for day-to-day tasks, like:'
    bullet:
      one: collecting the rent
      two: completing property inspections
      three: organising repairs and compliance checks
    insetText: This does not include any letting agents who are only advertising the property for you.
    fieldSetHeading: Are you using a property manager?
    radios:
      'yes': 'Yes'
      'no': No, I manage this property (or another joint landlord does)
      error:
        missing: Select if you are using a property manager
  details:
    heading: Provide your property manager’s details
    name:
      label: Name of person or company
      error:
        missing: Enter a name of a person or company
    email:
      label: Email address
      error:
        missing: Enter an email address
        invalidFormat: Enter an email address in the correct format, like name@example.com
    access:
      heading: Give your property manager access
      paragraph: Entering your property manager’s details here does not give them access to this registration. You can do this from the property’s registration page.
  check:
    heading: You’ve added a property manager
    insetText: After you submit and pay, we’ll contact this person to say they’re listed on your registration.
    emailAddress: Email address
  remove:
    fieldSetHeading: Are you sure you want to remove {0}?
    fieldSetHint: They will be removed as your property manager
    radios:
      error:
        missing: Select if you want to remove this property manager
paymentDescription: Register your rental property
paymentSummary:
  heading: Property fee
  annualFee: The annual property fee is {0}. You are paying an adjusted (pro-rated) fee.
  preGratisPeriod: There is no charge for the service until {0}. You are paying for {0} to your renewal date.
  postGratisPeriod: You are paying for {0} to your renewal date.
  renewalDateExplanation: Your renewal date is 1 year from when you registered your first property.
  guidance:
    prefix: Find out more about
    link: the annual property fee (opens in new tab)
    afterLink: .
  summary:
    heading: Payment summary
    address: Property address
    payment: Payment
    paymentDate: Payment date
    renewalDate: Renewal date
  prnHint: Your property will be registered when you pay and you will be given a Property Registration Number.
  button: Go to payment
paymentProcessing:
  heading: Your payment is processing
  js:
    doNotClose: Do not close or refresh this tab.
    redirect: When your payment is processed you will be automatically redirected.
  noJs:
    notConfirmed: We have not yet received confirmation that your payment was successful.
    checkStatus: Select Check payment status to see if your payment has been completed.
    button: Check payment status
paymentFailed:
  heading: Your payment has been declined
  contactBank: Contact your bank for more details. No money has been taken from your account.
  notRegistered: Your property has not been registered. You must pay the property fee to complete your property registration.
  tryAgainLink: Go back to try the payment again.
  getHelp: Get help with payment
paymentNotCompleted:
  heading: Your payment could not be completed
  reason: This can happen if you started another payment in a different tab or window, or if there was a problem with GOV.UK Pay.
  notRegistered: Your property has not been registered.
  refund: If any money was taken from your account, it will be refunded.
  payAgain: You need to pay again to register this property.
whoProvidesRentalDetails:
  heading: Who will provide details about how your property’s rented out
  intro: 'To register your property, we need details about:'
  bullet:
    licensing: if your property needs a license
    complianceCertificates: compliance certificates
    tenancy: the current tenancy
  lettingAgentParagraph: If you’re using a letting agent or property manager, you can choose for them to provide these details for you. They can also keep these details up to date.
  fieldSetHeading: Who will provide this property’s rental details?
  radios:
    error:
      missing: Select who will provide this property’s rental details
    option:
      landlord:
        label: I will provide these details
      lettingAgent:
        label: My letting agent or property manager
        hint: Give them access to provide these details
  changeToLettingAgent:
    heading: Are you sure you want to change this?
    pageTitle: Are you sure you want your letting agent to provide details?
    paragraph:
      one: You’ve selected for your letting agent or property manager to provide details about how your property’s rented out.
      two: 'This means we’ll remove the details you’ve already provided about:'
      three: You can go back to undo this change.
    bullet:
      one: property licensing
      two: compliance certificates
      three: the current tenancy
lettingAgentEmail:
  heading: Allow your letting agent or property manager to provide details
  howItWorks:
    heading: How it works
    step1: "You’ll enter your letting agent or property manager’s email address, then skip to paying for this property."
    step2: "We’ll ask your letting agent or property manager to provide the licensing, compliance certificates and tenancy details."
    step3: They can keep these details up to date for you.
  canRemove: You can remove your letting agent or property manager at any time.
  responsible:
    heading: You remain responsible for this registration
    body: "You should always check that your registration is correct. We’ll email you whenever your letting agent or property manager makes an update."
  insetText: "You must check that all your property’s details are provided within 28 days. We’ll email you if no one has added these details after 14 days."
  emailLabel: "What is your letting agent or property manager’s email address?"
  emailHint: "We’ll email them a link to provide this property’s remaining details"
  submitButton: Save and continue
occupancyChangeInterruption:
  heading: Are you sure you want to change this?
  pageTitle: Are you sure you want to change this property to unoccupied?
  paragraph:
    one: You’ve changed this property to being unoccupied.
    two: This means you cannot ask your letting agent or property manager to provide this property’s details.
    three: You must now complete this registration yourself, adding as many details as you can.
    four: When the property’s occupied, you can add a letting agent or property manager again. They can provide any missing details for you.
    five: You can go back to undo this change.
freeholders:
  intro:
    heading:
      joint: Add joint freeholders
      nonJoint: Add freeholders
    paragraph:
      joint: Provide the details of the other freeholders one by one.
      nonJoint: Freeholders own the property and its land for an indefinite time. They may be an individual person, multiple people or a company.
    responsibility: You must add each freeholder’s details as they all have responsibility for the property’s condition.
    help:
      summary: How to find out who your freeholder is
      paragraph:
        one: The person on your lease may be the freeholder or know who it is.
        two:
          beforeLink: You can also find the freeholder on the property’s title register (sometimes known as the ‘title deeds’). Get the title register by
          linkText: searching for land and property information (opens in new tab)
          afterLink: .
    buttons:
      addFirstFreeholder: Add first freeholder
  provideDetails:
    fieldSetHeading:
      joint: Can you provide this joint freeholder’s details?
      nonJoint: Can you provide this freeholder’s details?
    radios:
      option:
        'yes':
          hint: Provide a name and either an email or postal address
        'no':
          hint: You can continue, but return and add these details when you can
      error:
        missing:
          joint: Select if you can provide this joint freeholder’s contact details
          nonJoint: Select if you can provide this freeholder’s contact details
  name:
    fieldSetHeading:
      joint: What is this joint freeholder’s name?
      nonJoint: What is this freeholder’s name?
    fieldSetHint: This can be the name of a person, company or organisation
    error:
      missing: Enter a name
  email:
    fieldSetHeading: What is {0}’s email address?
    error:
      missing: Enter an email address
      invalidFormat: Enter an email address in the correct format, like name@example.com
      duplicate: You’ve already used this email address for another freeholder - enter a different email address
  contactType:
    fieldSetHeading: Which contact information can you provide for {0}?
    fieldSetHint: You only need to provide one
    radios:
      option:
        email:
          label: Email address
          hint: This will let us contact them quicker
        postalAddress:
          label: Postal address
      error:
        missing: Select which contact information you can provide
  address:
    lookup:
      fieldSetHeading: What is {0}’s address?
    select:
      fieldSetHeading: Select {0}’s address
    manual:
      fieldSetHeading: What is {0}’s address?
  list:
    heading:
      joint: '{0,choice,1#You’ve added 1 joint freeholder|1<You’ve added {0} joint freeholders}'
      single: '{0,choice,1#You’ve added 1 freeholder|1<You’ve added {0} freeholders}'
    insetText: After you submit and pay, we’ll contact these people to say they’re listed on your registration. They will not be able to change any of the registration’s details.
    emailAddress: Email address
    postalAddress: Postal address
    unknownFreeholder:
      title: Unknown freeholder
      body: You told us there was another freeholder, but you cannot currently provide their details. Return and add these details when you can.
    buttons:
      addAnother: Add another freeholder
  remove:
    fieldSetHeading: 'Are you sure you want to remove {0,,freeholderName}?'
    unknownFreeholder:
      fieldSetHeading: Are you sure you want to remove this unknown freeholder?
    fieldSetHint: They will be removed as a freeholder
    radios:
      error:
        missing: Select if you want to remove this freeholder

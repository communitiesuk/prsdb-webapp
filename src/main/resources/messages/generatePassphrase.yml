banner:
  heading: New passphrase
  body: The passphrase is
paragraph:
  one: This passphrase helps you to authenticate a landlord over the phone.
  two: >
    Prefer authenticating by email where possible, or SMS as a second choice. Use post only as a last resort. To authenticate a landlord
    by email or SMS, send this passphrase to their stored contact details, ask them to repeat it to you (over the phone), and check it
    matches. Always generate a new passphrase for every authentication attempt.
  three: >
    For postal-only landlords, send this passphrase by post and record it against their customer record. When they later call the
    contact centre and you need them to authenticate, ask them to repeat their passphrase to you and check it matches their customer record.
generateAnother: Generate another passphrase

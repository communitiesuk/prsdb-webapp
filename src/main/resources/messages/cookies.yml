heading: Cookies
paragraph:
  one: 'Cookies are small files saved on your phone, tablet or computer when you visit a website. We use cookies to make this site work.'
essential:
  heading: Essential cookies
  paragraph: Essential cookies keep your information secure while you use this service. We do not need to ask permission to use them.
  table:
    caption: Essential cookies we use
    session:
      name: session
      purpose: Keeps you signed in
      expires: When you close your web browser
    file-upload-cookie:
      name: file-upload-cookie
      purpose: Makes uploading files on the service secure
      expires: When you close your web browser
table:
  heading:
    name: Name
    purpose: Purpose
    expires: Expires

sectionHeading: Tenancy details
numberOfHouseholds:
  heading: Number of households
  questionHeading: How many households live in this property?
  paragraph:
    one: A household is one person living alone or a family living together.
    two: Unrelated adults (who are not a couple) are separate households.
  details:
    summary: Help with who to count as a family
    paragraph: 'A family includes people who are:'
    bullet:
      one: married
      two: related (like aunts or cousins)
      three: living together as a couple
  label: Enter how many households live in your property
  input:
    error: 'Enter how many separate households, like 1 or 2'
numberOfPeople:
  input:
    error:
      invalidFormat: 'Enter how many people, like 2 or 5'
      invalidNumber: The number of people in the property must be the same as or higher than the number of households in the property
  fieldSetHeading: How many people live here in total?
  details:
    summary: Help with who to include
    paragraph:
      one: Include everyone who lives here permanently, including children and babies.
      two: 'Do not include anyone staying here temporarily, such as:'
    bullet:
      one: guests staying for less than 90 days
      two: people who have another main home elsewhere
rentIncludesBills:
  radios:
    error:
      missing: Select if the rent includes any bills
  fieldSetHeading: Does the rent include any bills?
  fieldSetHint: For example, energy, broadband, Council Tax or cleaning
billsIncluded:
  error:
    missing: Select which bills you include in the rent
    other:
      missing: Enter the other bills you include in the rent
      tooLong: The description of other bills and services must be 200 characters or fewer
  fieldSetHeading: Which bills are included?
  fieldSetHint: Select all that apply
  checkbox:
    gas: Gas
    electricity: Electricity
    water: Water
    councilTax: Council Tax
    landline: Landline
    broadband: Broadband
    tvLicence: TV Licence
    cableSatelliteTV: Cable or satellite TV
    parking: Parking
    gardening: Gardening
    communalAreasCleaner: Cleaner for communal areas
    other: Other
    'other.label': Other bills
furnishedStatus:
  radios:
    error:
      missing: Select how the property is furnished
    options:
      furnished:
        label: Fully furnished
        hint: All essential furniture and appliances
      partFurnished:
        label: Partly furnished
        hint: Some furniture and appliances (for example, there's a washing machine but no bed)
      unfurnished:
        label: Unfurnished
  fieldSetHeading: How is the property furnished?
  fieldSetHint: Select one
rentFrequency:
  heading: How often do you charge rent?
  details:
    summary: Help with rent in advance
    paragraph:
      one: You can no longer ask for tenants to pay for multiple months of rent in advance.
      two: 'You can only ask for:'
      three: You can only ask for this rent in advance during the ‘pre-tenancy period’. This is the time between signing the tenancy agreement and starting the tenancy.
    bullet:
      one: 1 month of rent, if rent will be paid monthly
      two: 28 days of rent, if rent will be paid at any other interval (for example, weekly)
  radios:
    option:
      monthly:
        label: Monthly
        hint: You collect rent on the same date each month
      fourWeekly:
        label: Every 4 weeks
        hint: You collect rent every 28 days
      weekly:
        label: Weekly
      other:
        label: Other
        input:
          label: How often do you charge rent?
          error:
            missing: Enter how often you charge rent
    error:
      missing: Select how often you charge rent
rentAmount:
  heading:
    weekly: Rent charged each week
    fourWeekly: Rent charged every 4 weeks
    monthly: Rent charged each month
    other: Equivalent monthly rent
  subheading:
    weekly: How much is the weekly rent, in pounds?
    fourWeekly: How much is the rent every 4 weeks, in pounds?
    monthly: How much is the monthly rent, in pounds?
    other:
      one: What to include
      two: What is the rent, as a monthly figure in pounds?
  paragraph:
    one:
      weekly: Enter the total weekly rent agreed with the tenant.
      fourWeekly: Enter the total 4-weekly rent agreed with the tenant.
      monthly: Enter the total monthly rent agreed with the tenant.
      other: Enter the total monthly rent agreed with the tenant.
    two: 'You must include:'
    three: 'Do not include:'
    five: Tell us how much rent you charge, converted into a monthly figure.
  bullet:
    one: the agreed rent
    two: the rent for the whole property (if the property is an HMO, do not enter the price per room)
    three: any bills included in the rent
    four: rent arrears
    five: rent in advance payments
  details:
    summary: How to calculate a monthly figure
    subheading:
      one: If you charge rent every 2 weeks
      two: Other rent periods
    paragraph:
      one: Multiply the rent by 26, then divide it by 12.
      two: Calculate how much the rent is per year, then divide it by 12.
  fieldSetHint: For example, 650.50
  error: Rent amount must only include numbers (and a decimal point), like 600 or 193.54
provideTenancyDetailsLater:
  heading: Provide tenancy details later
  paragraph:
    one: You can continue and submit your registration now, but you’ll need to return later and provide details about the current tenancy.
  whenToProvide:
    heading: When you’ll need to provide these tenancy details
    insetText: To keep your property registered, you must provide its tenancy details within 28 days.
    paragraph: This is because you’ve told us this property’s occupied by tenants.
  reason: 'We’ll need to know:'
  weWillNeedToKnow:
    bullet:
      one: how many people are living in the property
      two: if you’ve provided furniture
      three: how much the rent is
checkAnswers:
  heading: Tenancy details
  tenancyDetailsRow: Tenancy details
  occupied: Occupied by tenants
  households: Number of households
  provideLater: Provide this later
  unoccupiedBodyText: We’ll ask for tenancy details when your property becomes occupied.
  people: Number of tenants
  rentIncludesBills: Rent includes bills
  billsIncluded: Which bills are included
  furnishedStatus: Furniture provided
  rentFrequency: When rent is paid
  rentAmount: Rent amount
  customFrequencyRentAmountSuffix: per month

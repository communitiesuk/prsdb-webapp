orgTypeTrustInterruption:
  addingTrust:
    heading: You must provide trustee details
    paragraph:
      one: You’ve selected that your organisation is a trust.
      two: You must provide details including contact information for your organisation’s lead trustee.
  removingTrust:
    heading: Are you sure you want to change this?
    paragraph:
      one: "You’ve changed the type of your organisation from a trust to {0}."
      two: This means that the lead trustee details will be removed.
      three: If they are still part of your organisation’s governing body you must add them as a member of the governing body.
  orgType:
    company: company
    charity: charity
    none: none of these

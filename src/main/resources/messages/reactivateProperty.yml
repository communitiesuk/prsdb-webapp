info:
  heading: Reactivate your property
  youAreReactivating: 'You are reactivating:'
  whatHappensNext:
    heading: What happens next
    paragraph:
      one: You’ll need to provide any missing information before this property can be reactivated.
      two: 'This could include:'
      three: You must complete this information yourself. You cannot ask a letting agent or property manager to do it for you.
    bullet:
      one: licensing information
      two: gas safety certificate
      three: electrical safety certificate
      four: energy performance certificate (EPC)
      five: tenancy details
  insetText: You must complete all the information and submit in one go. Your answers will not be saved until you submit.
alreadyRegistered:
  heading: There is an active registration for this property
  paragraph: This property has been registered again since it was deactivated. There can only be one active registration for a property.
  ifYouAreTheLandlord:
    heading: If you are the landlord for this property
    paragraph: Check with any joint landlords to make sure they have not registered the property.
  contactUs:
    heading: Contact us for help
  registerNewPropertyLink: Register a new property

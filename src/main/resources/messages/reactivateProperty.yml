info:
  heading: Reactivate your property
  youAreReactivating: 'You are reactivating:'
  whatHappensNext:
    heading: What happens next
    paragraph:
      one: You’ll need to provide any missing information before this property can be reactivated.
      two: 'This could include:'
      three: You must complete this information yourself. You cannot ask a letting agent or property manager to do it for you.
    bullet:
      one: licensing information
      two: gas safety certificate
      three: electrical safety certificate
      four: energy performance certificate (EPC)
      five: tenancy details
  insetText: You must complete all the information and submit in one go. Your answers will not be saved until you submit.
alreadyRegistered:
  heading: There is an active registration for this property
  paragraph: This property has been registered again since it was deactivated. There can only be one active registration for a property.
  ifYouAreTheLandlord:
    heading: If you are the landlord for this property
    paragraph: Check with any joint landlords to make sure they have not registered the property.
  contactUs:
    heading: Contact us for help
  registerNewPropertyLink: Register a new property
checkAnswers:
  insetText: You’ll be able to change the property’s other details after reactivating its registration.
  warning: Do not provide any false or misleading information on the database. By submitting this information, you confirm it’s accurate to the best of your knowledge.
  submitButton: Confirm details
confirmation:
  heading: Property reactivated
  youHaveReactivated: 'You have reactivated:'
  prn: 'Property Registration Number: {0}'
  emailSent: We’ve sent you a confirmation email which includes your Property Registration Number.
  reactivationDetails:
    heading: Reactivation details
    paymentSummary:
      heading: Payment summary
    jointLandlords:
      heading: Joint landlords
      paragraph: We have notified all joint landlords that the property has been reactivated.
    landlordAccount:
      heading: Your landlord account
      individual: Your landlord account is now active.
      organisation: Your organisation’s landlord account is now active.
  whatToDoNext:
    heading: What to do next
    paragraph: Check that the rest of this property’s registration details are still correct
    goToPropertyRecord: Go to this property’s record
confirmMissingCompliance:
  areYouSure:
    heading: Are you sure you want to continue?
  radios:
    error:
      missing: Select whether you want to submit this reactivation

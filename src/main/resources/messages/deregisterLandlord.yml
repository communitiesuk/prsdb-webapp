title: Deregister Landlord
areYouSure:
  heading: Are you sure you want to delete your account?
  paragraph:
    one: You’ll no longer be registered as a landlord in England.
    two: 'This means we will:'
  confirmButton: Yes, delete
  cancelLink: Cancel and go back
organisational:
  title: Deregister Organisational Landlord
  areYouSure:
    heading: Are you sure you want to delete your organisation?
    paragraph:
      one: By deleting your organisation, you are confirming that your organisation is no longer acting as a landlord.
      two: 'Your organisation’s information will be deleted from the service including:'
      three: We will send a confirmation email to all teams members.
      four: You will no longer be able to access the service.
    bulletList:
      one: all properties where your organisation is the only landlord
      two: team members
    confirmButton: Yes, delete
    cancelLink: Cancel and go back
  confirmation:
    banner:
      heading: Organisation deleted
      body: No longer registered as a landlord
    paragraph:
      one: 'TODO: PDJB-1484 - Organisation deregistration confirmation content'
confirmation:
  banner:
    heading: Account deleted
    body: You’re no longer registered as a landlord in England.
  paragraph:
    one: You’re no longer registered as a landlord in England. We’ve sent you an email to confirm this.
    two: You’ll need to register a new account if you become a landlord again.
withProperties:
  areYouSure:
    bulletList:
      one: delete all property registrations where you’re the only landlord
      two: remove you as a joint landlord from any properties

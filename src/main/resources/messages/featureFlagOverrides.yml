title: Feature flag overrides
heading: Feature flag overrides
description: These overrides apply only to your own browser session and are cleared when it ends.
releasesHeading: Releases
flagsHeading: Feature flags
hint:
  defaultOn: Default is on
  defaultOff: Default is off
  inRelease: ', in release {0}'

sectionHeading: Tell us if this property needs a licence
licensingType:
  fieldSetHeading: Which licence does this property have?
  fieldSetHint: Select one
  radios:
    error:
      missing: Select this property’s licence, or select ‘This property does not need a licence’
    option:
      selectiveLicence:
        label: Selective licence
        hint: Some councils require this in specific areas
      hmoMandatory:
        label: HMO mandatory licence
        radioLabel: House in Multiple Occupation (HMO) mandatory licence
        hint: For HMOs with 5 or more tenants who form more than 1 household
      hmoAdditional:
        label: HMO additional licence
        radioLabel: House in Multiple Occupation (HMO) additional licence
        hint: For smaller HMOs, required by only some councils
      noLicensing:
        label: This property does not need a licence
licenceNumber:
  error:
    tooLong: The licensing number is too long
  detail:
    summary: If your council does not issue this number
    text: Enter ‘not applicable’ as your answer to this question.
selectiveLicence:
  error:
    missing: Enter the selective licence number
  fieldSetHeading: What is your selective licence number?
hmoMandatoryLicence:
  error:
    missing: Enter the HMO Mandatory licence number
  fieldSetHeading: What is your HMO mandatory licence number?
hmoAdditionalLicence:
  error:
    missing: Enter the HMO additional licence number
  fieldSetHeading: What is your HMO additional licence number?
provideLicensingLater:
  occupied:
    heading: Provide details about property licensing later
    paragraph:
      one: You can continue and submit your registration now, but you’ll need to return later and provide details about this property’s licence.
    whenToAdd:
      heading: When you must do this by
      insetText: To keep your property registered, you must provide its licensing details within 28 days.
      paragraph: This is because you’ve told us this property’s occupied by tenants.
  unoccupied:
    heading: Provide details about property licensing later
    paragraph:
      one: If you’re unsure, check with the local council if your property needs a licence to be rented out.
    whenToAdd:
      heading: When you’ll need to provide these property licensing details
      paragraph:
        one: You can continue to finish your registration and get a Property Registration Number.
        two: 'Once your property’s occupied, you have 28 days to return and tell us:'
  weWillNeedToKnow:
    intro: 'We’ll need to know:'
    bullet:
      one: if your property needs a licence or not
      two: details about the licence (if your property needs one)
checkAnswers:
  heading: Tell us if the property needs a licence
  noLicensing: This property does not need a licence
  licensingProvideLater: Provide this later
  licensingProvideLaterUnoccupied: Provide this later (within 28 days of the property being occupied)

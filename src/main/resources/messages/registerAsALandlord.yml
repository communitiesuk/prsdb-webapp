confirmation:
  banner:
    heading: Registered as a landlord
    body:
      beforeRegistrationNumber: Landlord Registration Number
  emailParagraph: We’ve emailed you a copy of your Landlord Registration Number.
  whatYouNeedToDo:
    heading: What you need to do next
    paragraph:
      one: You now need to register your rental properties.
      two: Your local council could fine you if you advertise or let a property that is not registered.
      three: 'You could face fines or even criminal prosecution if you:'
    bullet:
      one: repeatedly break the rules
      two: 'commit a serious offence, like providing false information on this service'
  feedback:
    body: 'Answer a few short questions about <strong>landlord registration</strong>.'
privacyNotice:
  checkbox:
    error:
      missing: You must confirm you have read the privacy notice to continue
  heading: Your data privacy
  paragraph:
    one:
      beforeLink: Read the full
      linkText: private beta privacy notice (opens in new tab)
      afterLink: .
    two: Your account will be automatically deleted after this private beta.
  providingDetails:
    heading: Entering data during the private beta
    paragraph:
      one: Use your real name, date of birth and contact details.
      two: Enter real property details if you can. This will help to test the service.
      three: "You can enter dummy property details if you prefer, but it helps us if these are still realistic. You can ignore any warnings about providing false information \u2014 these do not apply during private beta."
      four: Councils will see any information you submit, but it will never be used for enforcement.
  checkBox:
    heading: Confirm you have read the privacy notice
    label: I confirm I have read the privacy notice for this private beta
  oneLoginInset: "When you continue, you\u2019ll be asked to prove your identity using your GOV.UK One Login."
landlordType:
  fieldSetHeading: Are you registering as an individual or an organisation?
  partnership:
    summary: Registering a partnership
    paragraph:
      one: All members of English business partnerships must register as individuals and follow the guidance for joint landlords.
      two: Limited Liability Partnerships (LLPs) and Scottish partnerships must register as organisations.
  radios:
    individual:
      label: An individual
      hint: You rent out a property as an individual, sole trader or joint landlord
    organisation:
      label: An organisation
      hint: You rent out a property as a company, charity or trust
    error:
      missing: Select if you are registering as an individual or an organisation

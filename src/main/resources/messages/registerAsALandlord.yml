title: Register as a Landlord
heading: 'Register your rental property: private beta'
caption: Register as a landlord
intro:
  one: Landlords will soon need to use GOV.UK to register their rental properties. This will help local councils understand the rental properties in their area.
  two: "You’ve been invited to test how registering properties will work. You can share feedback at any point. We’ll use your feedback to improve the service."
  inset: "Only invited landlords with properties in England can test this service. You’ll also need a contact address in England or Wales."
registeringAProperty:
  heading: Registering a property
  paragraph:
    one: "We’ll ask for some basic details about yourself and the property."
    two: "You’ll then get:"
    three: "When the law changes, you’ll need to include both these numbers on any adverts for properties you’re letting."
    four: Do not use the numbers from the test service on any real adverts.
  bullet:
    one: your Landlord Registration Number
    two: a Property Registration Number for each property you register
testTheService:
  heading: Test the service
  paragraph:
    one: "You’ll need a GOV.UK One Login to test this service. You’ll be able to create a GOV.UK One Login if you do not already have one."
    two: "You'll also need to prove your identity using your GOV.UK One Login. We'll guide you through this based on which device you're using and what photo ID you have."
    three: Parts of the service may change during the private beta period.

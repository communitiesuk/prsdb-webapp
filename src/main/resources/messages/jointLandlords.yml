hasJointLandlords:
  heading: Invite joint landlords
  paragraph:
    one: You must invite any other landlords for this property. These are sometimes called 'joint landlords'.
    two: We’ll email them a link to join the property after you complete this property’s registration. They’ll have 28 days to use this link.
    three: Add any other landlords you rent out this property with.
    four: This includes anyone who’s entitled to possession of the property, even if they’re not named on the tenancy agreement as a landlord.
    five: If you’re unsure who to add, you may need to
    six: Keeping the property up to date is everyone’s shared responsibility. After registering, each landlord can update the property’s details on the service.
  link:
    one: Who counts as a joint landlord
    two: find a legal adviser
  afterLink: .
  subHeading:
    one: Each landlord’s responsibility
    two: Are there any other landlords for this property?
  radios:
    "no": No, I am the only landlord for this property
  error:
    missing: Select if there are any other landlords for this property
inviteJointLandlord:
  fieldSetHeading: Invite a joint landlord to this property
  email:
    label: Enter their email address
  error:
    invalidEmail: Enter an email address in the correct format, like name@example.com
    cannotInviteSelf: You cannot invite yourself as a joint landlord
    alreadyInvited: You have already invited this email address
    alreadyOnProperty: This email address is already being used by another joint landlord
checkJointLandlords:
  heading: '{0,choice,1#You’ve added 1 joint landlord|1<You’ve added {0} joint landlords}'
  paragraph: We’ll send them an invitation link after you complete this property’s registration. They’ll have 28 days to join the property.
  invitedEmailAddress: 'Joint landlord {0}'
  buttons:
    addAnother: Add another landlord
removeJointLandlord:
  fieldSetHeading: 'Are you sure you want to remove {0,,email}?'
  fieldSetHint: We will not send them an invite when you submit this property
  radios:
    error:
      missing: Select if you want to remove this joint landlord

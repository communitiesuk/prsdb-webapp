<!--/*@thymesVar id="registerPropertyUrl" type="java.lang.String"*/-->
<!--/*@thymesVar id="title" type="java.lang.String"*/-->
<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(#{${title ?: 'landlordDetails.pageTitle'}(${orgLandlord.name})},~{::main/content()}, false, ${backUrl}, null)}">
<main>
    <span class="govuk-caption-l" th:text="#{landlordDetails.heading}">landlordDetails.heading</span>

    <h1 class="govuk-heading-l" th:text="${orgLandlord.name}">orgLandlord.name</h1>

    <p class="govuk-body" th:if="${showDeleteLandlordRecordLink}">
        <a id="delete-record-link" class="govuk-link" th:href="${deleteLandlordRecordUrl}"
           th:text="#{landlordDetails.org.removeRecord}">landlordDetails.org.removeRecord</a>
    </p>

    <div id="tabs" th:replace="~{fragments/tabs/tabs :: tabs(~{::#tabs/content()})}">
        <ul id="tab-headings" th:replace="~{fragments/tabs/tabsHeadingList :: tabsHeadingList(~{::#tab-headings/content()})}">
            <li th:replace="~{fragments/tabs/tabsListItem :: tabsListItem('organisation-details', #{landlordDetails.org.tabs.organisationDetails})}"></li>
            <li th:replace="~{fragments/tabs/tabsListItem :: tabsListItem('organisation-contacts', #{landlordDetails.org.tabs.organisationContacts})}"></li>
            <!--/* TODO PDJB-2149: Change this condition to ${isLandlordView} when the ACTIVE_INACTIVE feature flag is removed */-->
            <th:block th:if="${isLandlordView && isActiveInactiveEnabled}">
                <th:block th:replace="~{fragments/tabs/landlordPropertiesTabs :: landlordPropertiesTabListItems}"></th:block>
            </th:block>
            <!--/* TODO PDJB-2149: Change this condition to th:unless="${isLandlordView}" when the ACTIVE_INACTIVE feature flag is removed */-->
            <th:block th:unless="${isLandlordView && isActiveInactiveEnabled}">
                <li th:replace="~{fragments/tabs/tabsListItem :: tabsListItem(${registeredPropertiesTabId}, #{landlordDetails.registeredProperties.heading})}"></li>
            </th:block>
        </ul>

        <div id="organisation-details-panel" th:replace="~{fragments/tabs/tabsPanel :: tabsPanel('organisation-details', ~{::#organisation-details-panel/content()})}">
            <dl th:replace="~{fragments/summaryList :: summaryList(${orgLandlord.organisationDetails})}"></dl>
        </div>

        <div id="organisation-contacts-panel" th:replace="~{fragments/tabs/tabsPanel :: tabsPanel('organisation-contacts', ~{::#organisation-contacts-panel/content()})}">
            <th:block th:replace="~{fragments/tabs/organisationContactsPanel :: organisationContactsPanelContent}"></th:block>
        </div>

        <!--/* TODO PDJB-2149: Change this condition to ${isLandlordView} when the ACTIVE_INACTIVE feature flag is removed */-->
        <th:block th:if="${isLandlordView && isActiveInactiveEnabled}">
            <th:block th:replace="~{fragments/tabs/landlordPropertiesTabs :: landlordPropertiesTabPanels}"></th:block>
        </th:block>
        <!--/* TODO PDJB-2149: Change this condition to th:unless="${isLandlordView}" and keep only the local council panel content when the ACTIVE_INACTIVE feature flag is removed */-->
        <th:block th:unless="${isLandlordView && isActiveInactiveEnabled}">
            <div id="registered-properties-panel" th:replace="~{fragments/tabs/tabsPanel :: tabsPanel(${registeredPropertiesTabId}, ~{::#registered-properties-panel/content()})}">
                <th:block th:if="${isLandlordView}">
                    <th:block th:replace="~{fragments/tabs/registeredPropertiesPanel :: registeredPropertiesPanelContent}"></th:block>
                </th:block>
                <th:block th:unless="${isLandlordView}">
                    <th:block th:replace="~{fragments/tabs/localCouncilRegisteredPropertiesPanel :: localCouncilRegisteredPropertiesPanelContent}"></th:block>
                </th:block>
            </div>
        </th:block>
    </div>
</main>
</html>

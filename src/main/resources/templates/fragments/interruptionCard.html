<div th:fragment="interruptionCard(heading, bodyContent, buttonText, backUrl)" class="moj-interruption-card">
    <div class="moj-interruption-card__content">
        <h1 class="govuk-heading-l moj-interruption-card__heading" th:text="${heading}">heading</h1>
        <div class="govuk-body-l moj-interruption-card__body">
            <th:block th:replace="${bodyContent}"></th:block>
        </div>
        <div class="govuk-button-group moj-interruption-card__actions">
            <button type="submit" class="govuk-button govuk-button--inverse" data-module="govuk-button"
                    th:text="${buttonText}">
                buttonText
            </button>
            <a class="govuk-link govuk-link--inverse" th:href="@{${backUrl}}"
               th:text="#{forms.links.goBack}">
                forms.links.goBack
            </a>
        </div>
    </div>
</div>

<th:block th:fragment="summaryRowActionLink(action, heading, optionalHeadingParam)">
    <a th:if="${action.url != null}" class="govuk-link" th:href="@{${action.url}}">
        <span th:text="#{${action.text}}">forms.links.change</span>
        <span class="govuk-visually-hidden" th:text="#{${heading}(${optionalHeadingParam})}">fieldHeading</span>
    </a>
    <span th:if="${action.url == null}" th:text="#{${action.text}}">action.text</span>
</th:block>

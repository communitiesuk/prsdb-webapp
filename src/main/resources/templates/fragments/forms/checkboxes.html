<th:block id="checkboxes-content" th:fragment="checkboxes(label, fieldName, hint, options)"
          th:replace="~{fragments/forms/inputGroup :: inputGroup(${label}, ${fieldName}, ~{::#checkboxes-content/content()}, ${hint})}">
    <div class="govuk-checkboxes" data-module="govuk-checkboxes" th:with="firstSelectableOption=${options.?[!isDivider][0]}">
        <th:block th:each="option, itemStat: ${options}">
            <div th:if="${option.isDivider}" class="govuk-checkboxes__divider" th:text="#{${option.labelMsgKey}}"></div>
            <th:block th:if="${!option.isDivider}" th:with="checkboxInputID=${option == firstSelectableOption} ? ${fieldName} : |${fieldName}-${option.valueStr}|, hintID=|${fieldName}-${option.valueStr}-hint|, conditionalFragmentID=|${fieldName}-${option.valueStr}-conditional|">
            <div class="govuk-checkboxes__item">
                <input th:if="${options.size() == 1}" class="govuk-checkboxes__input" type="checkbox"
                       th:field="*{__${fieldName}__}" th:value="${option.value}" th:id="${checkboxInputID}"
                       th:attr="aria-describedby=${option.hintMsgKey != null} ? ${hintID}, data-aria-controls=${option.conditionalFragment != null} ? ${conditionalFragmentID}">
                <input th:unless="${options.size() == 1}"class="govuk-checkboxes__input" type="checkbox"
                       th:field="*{__${fieldName}__[__${itemStat.index}__]}" th:value="${option.value}" th:id="${checkboxInputID}"
                       th:attr="aria-describedby=${option.hintMsgKey != null} ? ${hintID}, data-aria-controls=${option.conditionalFragment != null} ? ${conditionalFragmentID}">
                <label class="govuk-label govuk-checkboxes__label" th:for="${checkboxInputID}"
                       th:text="${option.labelMsgKey != null ? #messages.msg(option.labelMsgKey) : option.value}">
                    Option Label
                </label>
                <div class="govuk-hint govuk-checkboxes__hint" th:if="${option.hintMsgKey != null}" th:id="${hintID}" th:text="#{${option.hintMsgKey}}">option.hintMsgKey</div>
            </div>
            <div th:if="${option.conditionalFragment}" class="govuk-checkboxes__conditional govuk-checkboxes__conditional--hidden" th:id="${conditionalFragmentID}" th:with="fragmentCall=|fragments/conditional/${option.conditionalFragment}|">
                <th:block th:replace="~{__${fragmentCall}__ :: ${option.conditionalFragment}}"></th:block>
            </div>
            </th:block>
        </th:block>
    </div>
</th:block>

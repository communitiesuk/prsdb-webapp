<dl th:fragment="summaryList(listRows)" class="govuk-summary-list">
    <th:block th:with="anyRowHasActions=${T(uk.gov.communities.prsdb.webapp.models.viewModels.summaryModels.SummaryListRowViewModelKt).anyRowHasActions(listRows)}">
        <th:block th:each="row: ${listRows}">
            <div th:replace="~{fragments/summaryRow :: summaryRow(${row.fieldHeading}, ${row.optionalFieldHeadingParam}, ${row.convertedFieldValue}, ${row.actions}, ${row.valueUrl},
                ${row.valueUrlOpensNewTab}, ${row.withoutBottomBorder}, ${row.withAriaLabelForAction}, ${row.tagColour}, ${row.optionalFieldValueParam}, ${anyRowHasActions})}" ></div>
        </th:block>
    </th:block>
</dl>

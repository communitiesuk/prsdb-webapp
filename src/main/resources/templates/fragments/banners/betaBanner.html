<html>
    <div class="govuk-phase-banner govuk-width-container" id="banner" th:fragment="betaBanner" th:if="${hideBetaBanner != true}">
        <p class="govuk-phase-banner__content">
            <strong class="govuk-tag govuk-phase-banner__content__tag" th:text="#{betaBanner.tag}">betaBanner.tag</strong>
            <span class="govuk-phase-banner__text">
                <th:block th:text="#{betaBanner.beforeLink}">betaBanner.beforeLink</th:block>
                <a class="govuk-link" th:href="${feedbackBannerUrl}" th:text="#{betaBanner.link}" target="_blank">betaBanner.link</a>
                <th:block th:text="#{betaBanner.afterLink}">betaBanner.afterLink</th:block>
            </span>
        </p>
    </div>
</html>

<html>
    <div class="govuk-phase-banner" id="feature-flag-override-banner"
         th:fragment="featureFlagOverrideBanner" th:if="${featureFlagOverridesActive}">
        <p class="govuk-phase-banner__content">
            <strong class="govuk-tag govuk-phase-banner__content__tag"
                    th:text="#{featureFlagOverrideBanner.tag}">featureFlagOverrideBanner.tag</strong>
            <span class="govuk-phase-banner__text"
                  th:text="#{featureFlagOverrideBanner.text} + '&nbsp;'">featureFlagOverrideBanner.text</span>
            <a class="govuk-link" th:href="${featureFlagOverridesUrl}"
               th:text="#{featureFlagOverrideBanner.link}">featureFlagOverrideBanner.link</a>
        </p>
    </div>
</html>

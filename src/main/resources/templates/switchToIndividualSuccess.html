<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(#{switchToIndividual.success.banner.heading}, ~{::main/content()}, false, null, null)}">
<main>
    <div id="page-contents"
         th:replace="~{fragments/layouts/twoThirdsLayout :: twoThirdsLayout(~{::#page-contents/content()})}">
        <div class="govuk-panel govuk-panel--confirmation">
            <h1 class="govuk-panel__title" th:text="#{switchToIndividual.success.banner.heading}">
                switchToIndividual.success.banner.heading
            </h1>
        </div>
        <p class="govuk-body" th:text="#{switchToIndividual.success.body.one}">
            switchToIndividual.success.body.one
        </p>
        <p class="govuk-body">
            <th:block th:replace="~{fragments/multiLineText :: multiLineText(${addressParts})}"></th:block>
        </p>
        <p class="govuk-body" th:text="#{switchToIndividual.success.body.two}">
            switchToIndividual.success.body.two
        </p>
        <p class="govuk-body">
            <a class="govuk-link" th:href="${propertyDetailsUrl}" th:text="#{switchToIndividual.success.goBackToPropertyRegistration}">
                switchToIndividual.success.goBackToPropertyRegistration
            </a>
        </p>
    </div>
</main>
</html>

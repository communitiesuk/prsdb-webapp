<!--/*@thymesVar id="formModel" type="java.lang.Object"*/-->
<!--/*@thymesVar id="backUrl" type="java.lang.String"*/-->
<!--/*@thymesVar id="sectionHeaderInfo" type="uk.gov.communities.prsdb.webapp.models.viewModels.SectionHeaderViewModel"*/-->
<!--/*@thymesVar id="heading" type="java.lang.String"*/-->
<!--/*@thymesVar id="introText" type="java.lang.String"*/-->
<!--/*@thymesVar id="responsibilityText" type="java.lang.String"*/-->
<!--/*@thymesVar id="showHelpDetails" type="java.lang.Boolean"*/-->
<!--/*@thymesVar id="helpDetailsSummary" type="java.lang.String"*/-->
<!--/*@thymesVar id="helpDetailsParagraphOne" type="java.lang.String"*/-->
<!--/*@thymesVar id="helpDetailsParagraphTwoBeforeLink" type="java.lang.String"*/-->
<!--/*@thymesVar id="landRegistryLinkText" type="java.lang.String"*/-->
<!--/*@thymesVar id="helpDetailsParagraphTwoAfterLink" type="java.lang.String"*/-->
<!--/*@thymesVar id="landRegistrySearchUrl" type="java.lang.String"*/-->
<!--/*@thymesVar id="submitButtonText" type="java.lang.String"*/-->
<!DOCTYPE html>
<html id="form-content" th:replace="~{fragments/forms/questionPage :: questionPage(#{${heading}}, ${formModel}, ~{::#form-content/content()}, ${backUrl}, ${sectionHeaderInfo})}">
    <h1 class="govuk-heading-xl" th:text="#{${heading}}">heading</h1>
    <p class="govuk-body" th:text="#{${introText}}">introText</p>
    <p class="govuk-body" th:text="#{${responsibilityText}}">responsibilityText</p>
    <th:block th:if="${showHelpDetails}">
        <details id="details-content" th:replace="~{fragments/details :: details(#{${helpDetailsSummary}}, ~{::#details-content/content()})}">
            <div class="govuk-details__text">
                <p class="govuk-body" th:text="#{${helpDetailsParagraphOne}}">helpDetailsParagraphOne</p>
                <p class="govuk-body">
                    <span th:text="#{${helpDetailsParagraphTwoBeforeLink}}">helpDetailsParagraphTwoBeforeLink</span>
                    <a class="govuk-link" th:href="${landRegistrySearchUrl}" target="_blank" rel="noopener noreferrer" th:text="#{${landRegistryLinkText}}">landRegistryLinkText</a><span th:text="#{${helpDetailsParagraphTwoAfterLink}}">helpDetailsParagraphTwoAfterLink</span>
                </p>
            </div>
        </details>
    </th:block>
    <button th:replace="~{fragments/buttons/primaryButton :: primaryButton(#{${submitButtonText}})}"></button>
</html>

<!--/*@thymesVar id="formModel" type="java.lang.Object"*/-->
<!--/*@thymesVar id="backUrl" type="java.lang.String"*/-->
<!--/*@thymesVar id="sectionHeaderInfo" type="uk.gov.communities.prsdb.webapp.models.viewModels.SectionHeaderViewModel"*/-->
<!--/*@thymesVar id="summaryCardTitle" type="java.lang.String"*/-->
<!--/*@thymesVar id="summaryCardActions" type="java.util.List"*/-->
<!--/*@thymesVar id="summaryListRows" type="java.util.List"*/-->
<!--/*@thymesVar id="radioOptions" type="uk.gov.communities.prsdb.webapp.models.viewModels.formModels.RadiosViewModel"*/-->
<!--/*@thymesVar id="whenYouCanRegisterAnExemptionUrl" type="java.lang.String"*/-->
<!--/*@thymesVar id="epcGuideUrl" type="java.lang.String"*/-->
<!DOCTYPE html>
<html th:replace="~{fragments/forms/complexQuestionPage :: complexQuestionPage(#{propertyCompliance.epcTask.confirmEpcDetailsFromUprn.heading}, ${formModel}, ~{::#form-content}, ~{::#question-content}, ${backUrl}, ${sectionHeaderInfo})}">
    <th:block id="question-content">
        <h1 class="govuk-heading-l" th:text="#{propertyCompliance.epcTask.confirmEpcDetailsFromUprn.heading}">
            propertyCompliance.epcTask.confirmEpcDetailsFromUprn.heading
        </h1>
        <p class="govuk-body" th:text="#{propertyCompliance.epcTask.confirmEpcDetailsFromUprn.paragraph}">
            propertyCompliance.epcTask.confirmEpcDetailsFromUprn.paragraph
        </p>
        <div th:replace="~{fragments/summaryCard :: summaryCard(${summaryCardTitle}, null, ${summaryCardActions}, ${summaryListRows})}"></div>
    </th:block>
    <th:block id="form-content">
        <th:block id="fieldset-content"
                  th:replace="~{fragments/forms/minorFieldSet :: minorFieldSet(~{::#fieldset-content/content()}, 'matchedEpcIsCorrect', #{propertyCompliance.epcTask.confirmEpcDetailsFromUprn.question}, null)}">
            <th:block th:replace="~{fragments/content/epcRequirementsDetails :: epcRequirementsDetails(${whenYouCanRegisterAnExemptionUrl}, ${epcGuideUrl})}"></th:block>
            <th:block th:replace="~{fragments/forms/radios :: radios(null, 'matchedEpcIsCorrect', null, ${radioOptions})}"></th:block>
        </th:block>
        <button th:replace="~{fragments/buttons/primaryButton :: primaryButton(#{${submitButtonText ?: 'forms.buttons.saveAndContinue'}})}"></button>
    </th:block>

</html>

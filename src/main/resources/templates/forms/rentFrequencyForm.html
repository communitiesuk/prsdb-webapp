<!--/*@thymesVar id="formModel" type="java.lang.Object"*/-->
<!--/*@thymesVar id="heading" type="java.lang.String"*/-->
<!--/*@thymesVar id="backUrl" type="java.lang.String"*/-->
<!--/*@thymesVar id="radioOptions" type="java.lang.Object"*/-->
<!DOCTYPE html>
<html th:replace="~{fragments/forms/questionPage :: questionPage(#{${heading}}, ${formModel}, ~{::#form-content/content()}, ${backUrl}, ${sectionHeaderInfo})}">
<th:block id="form-content">
    <th:block id="fieldset-content"
              th:replace="~{fragments/forms/fieldSet :: fieldSet(content=~{::#fieldset-content/content()}, fieldName='rentFrequency', fieldSetHeading=#{${heading}}, fieldSetHint=null, conditionalFieldName='customRentFrequency')}">
        <details id="details" th:replace="~{fragments/details :: details(#{tenancyDetails.rentFrequency.details.summary}, ~{::#details/content()})}">
            <div class="govuk-details__text">
                <p class="govuk-body" th:text="#{tenancyDetails.rentFrequency.details.paragraph.one}">tenancyDetails.rentFrequency.details.paragraph.one</p>
                <p class="govuk-body" th:text="#{tenancyDetails.rentFrequency.details.paragraph.two}">tenancyDetails.rentFrequency.details.paragraph.two</p>
                <ul class="govuk-list govuk-list--bullet">
                    <li th:text="#{tenancyDetails.rentFrequency.details.bullet.one}">tenancyDetails.rentFrequency.details.bullet.one</li>
                    <li th:text="#{tenancyDetails.rentFrequency.details.bullet.two}">tenancyDetails.rentFrequency.details.bullet.two</li>
                </ul>
                <p class="govuk-body" th:text="#{tenancyDetails.rentFrequency.details.paragraph.three}">tenancyDetails.rentFrequency.details.paragraph.three</p>
            </div>
        </details>
        <th:block th:replace="~{fragments/forms/radios :: radios(null, 'rentFrequency', null, ${radioOptions})}"></th:block>
    </th:block>
    <button th:replace="~{fragments/buttons/primaryButton :: primaryButton(#{${submitButtonText ?: 'forms.buttons.saveAndContinue'}})}"></button>
</th:block>
</html>

<!--/*@thymesVar id="formModel" type="java.lang.Object"*/-->
<!--/*@thymesVar id="fieldSetHeading" type="java.lang.String"*/-->
<!--/*@thymesVar id="backUrl" type="java.lang.String"*/-->
<!--/*@thymesVar id="detailSummary" type="java.lang.String"*/-->
<!--/*@thymesVar id="detailText" type="java.lang.String"*/-->
<!--/*@thymesVar id="submitButtonText" type="java.lang.String"*/-->
<!DOCTYPE html>
<html th:replace="~{fragments/forms/questionPage :: questionPage(#{${fieldSetHeading}}, ${formModel}, ~{::#form-content}, ${backUrl}, ${sectionHeaderInfo})}">
<form id="form-content" th:remove="tag">
    <th:block th:with="fieldSetHeadingLabelTo='licenceNumber'">
        <fieldset id="fieldset-content"
                  th:replace="~{fragments/forms/fieldSet :: fieldSet(~{::#fieldset-content/content()}, 'licenceNumber', #{${fieldSetHeading}}, null)}">
            <input th:replace="~{fragments/forms/fixedWidthTextInput :: fixedWidthTextInput(null, 'licenceNumber', null, 20)}">
        </fieldset>
    </th:block>
    <details id="details-content" th:replace="~{fragments/details :: details(#{${detailSummary}},~{::#details-content/content()})}">
        <div class="govuk-details__text" th:text="#{${detailText}}">detailText</div>
    </details>
    <button th:replace="~{fragments/buttons/primaryButton :: primaryButton(#{${submitButtonText}})}"></button>
</form>
</html>

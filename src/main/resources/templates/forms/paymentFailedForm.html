<!--/*@thymesVar id="formModel" type="uk.gov.communities.prsdb.webapp.models.requestModels.formModels.NoInputFormModel"*/-->
<!--/*@thymesVar id="backUrl" type="java.lang.String"*/-->
<!--/*@thymesVar id="sectionHeaderInfo" type="uk.gov.communities.prsdb.webapp.models.viewModels.SectionHeaderViewModel"*/-->
<!--/*@thymesVar id="tryAgainUrl" type="java.lang.String"*/-->
<!DOCTYPE html>
<html th:replace="~{fragments/forms/questionPage :: questionPage(#{registerProperty.paymentFailed.heading}, ${formModel}, ~{::#form-content}, ${backUrl}, ${sectionHeaderInfo})}">
<th:block id="form-content">
    <h1 class="govuk-heading-l" th:text="#{registerProperty.paymentFailed.heading}">
        registerProperty.paymentFailed.heading
    </h1>
    <p class="govuk-body" th:text="#{registerProperty.paymentFailed.contactBank}">
        registerProperty.paymentFailed.contactBank
    </p>
    <p class="govuk-body" th:text="#{registerProperty.paymentFailed.notRegistered}">
        registerProperty.paymentFailed.notRegistered
    </p>
    <p class="govuk-body">
        <a class="govuk-link" th:href="@{${tryAgainUrl}}" th:text="#{registerProperty.paymentFailed.tryAgainLink}">
            registerProperty.paymentFailed.tryAgainLink
        </a>
    </p>
    <details id="details" th:replace="~{fragments/details :: details(#{registerProperty.paymentFailed.getHelp}, ~{::#details/content()})}">
        <div class="govuk-details__text">
            <p class="govuk-body">
                <span th:text="#{common.contactDetails.phone}">common.contactDetails.phone</span><br>
                <span th:text="#{common.contactDetails.phoneHours}">common.contactDetails.phoneHours</span>
            </p>
            <p class="govuk-body">
                <span th:text="#{common.contactDetails.emailLabel}">common.contactDetails.emailLabel</span>
                <a class="govuk-link" th:href="'mailto:' + #{common.contactDetails.email}"
                   th:text="#{common.contactDetails.email}">common.contactDetails.email</a>
            </p>
        </div>
    </details>
</th:block>
</html>

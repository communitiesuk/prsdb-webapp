<!--/*@thymesVar id="formModel" type="uk.gov.communities.prsdb.webapp.models.requestModels.formModels.RemovePropertyManagerFormModel"*/-->
<!--/*@thymesVar id="fieldSetHeadingParam" type="java.lang.String"*/-->
<!--/*@thymesVar id="backUrl" type="java.lang.String"*/-->
<!--/*@thymesVar id="sectionHeaderInfo" type="uk.gov.communities.prsdb.webapp.models.viewModels.SectionHeaderViewModel"*/-->
<!--/*@thymesVar id="radioOptions" type="java.util.List<uk.gov.communities.prsdb.webapp.models.viewModels.formModels.RadiosButtonViewModel>"*/-->
<!DOCTYPE html>
<html th:replace="~{fragments/forms/questionPage :: questionPage(#{registerProperty.propertyManager.remove.fieldSetHeading(${fieldSetHeadingParam})}, ${formModel}, ~{::#form-content}, ${backUrl}, ${sectionHeaderInfo})}">
<th:block id="form-content">
    <th:block id="fieldset-content"
              th:replace="~{fragments/forms/fieldSet :: fieldSet(~{::#fieldset-content/content()}, 'wantsToProceed', #{registerProperty.propertyManager.remove.fieldSetHeading(${fieldSetHeadingParam})}, #{registerProperty.propertyManager.remove.fieldSetHint})}">
        <th:block th:replace="~{fragments/forms/radios :: radios(null, 'wantsToProceed', null, ${radioOptions})}"></th:block>
    </th:block>
    <div class="govuk-button-group">
        <button th:replace="~{fragments/buttons/primaryButton :: primaryButton(#{forms.buttons.saveAndContinue})}"></button>
        <a th:href="@{${backUrl}}" class="govuk-link" th:text="#{forms.links.cancel}">forms.links.cancel</a>
    </div>
</th:block>
</html>

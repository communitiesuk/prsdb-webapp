<!--/*@thymesVar id="title" type="java.lang.String"*/-->
<!--/*@thymesVar id="formModel" type="java.lang.Object"*/-->
<!--/*@thymesVar id="backUrl" type="java.lang.String"*/-->
<!--/*@thymesVar id="sectionHeaderInfo" type="uk.gov.communities.prsdb.webapp.models.viewModels.SectionHeaderViewModel"*/-->
<!--/*@thymesVar id="companyVariant" type="java.lang.Boolean"*/-->
<!--/*@thymesVar id="summaryListData" type="java.util.List"*/-->
<!--/*@thymesVar id="governingBodyMemberCards" type="java.util.List"*/-->
<!--/*@thymesVar id="showWarning" type="java.lang.Boolean"*/-->
<!--/*@thymesVar id="submittedFilteredJourneyData" type="java.lang.String"*/-->
<!--/*@thymesVar id="submitButtonText" type="java.lang.String"*/-->
<!DOCTYPE html>
<html th:replace="~{fragments/forms/complexQuestionPage :: complexQuestionPage(#{${title}}, ${formModel}, ~{::#form-content}, ~{::#question-content}, ${backUrl}, ${sectionHeaderInfo})}">
    <th:block id="question-content">
        <span class="govuk-caption-l" th:text="#{landlordDetails.title}">landlordDetails.title</span>
        <h1 class="govuk-heading-l" th:text="#{forms.checkAnswers.heading}">forms.checkAnswers.heading</h1>

        <th:block th:if="${companyVariant}">
            <h2 class="govuk-heading-m" th:text="#{landlordDetails.update.companiesHouse.cya.companyDetails.heading}">landlordDetails.update.companiesHouse.cya.companyDetails.heading</h2>
        </th:block>
        <dl th:replace="~{fragments/summaryList :: summaryList(${summaryListData})}"></dl>

        <th:block th:unless="${companyVariant}">
            <h2 class="govuk-heading-m" th:text="#{landlordDetails.org.governingBody.heading}">landlordDetails.org.governingBody.heading</h2>
            <th:block th:each="memberCard : ${governingBodyMemberCards}">
                <div th:replace="~{fragments/summaryCard :: summaryCard(${memberCard.title}, ${memberCard.cardNumber}, ${memberCard.actions}, ${memberCard.summaryList})}"></div>
            </th:block>
        </th:block>

        <th:block th:if="${showWarning}">
            <div th:replace="~{fragments/warningText :: warningText(#{forms.warning})}">forms.update.warning</div>
        </th:block>
    </th:block>
    <th:block id="form-content">
        <input type="hidden" name="submittedFilteredJourneyData" th:value="${submittedFilteredJourneyData}"/>
        <button th:replace="~{fragments/buttons/transactionSubmitButton :: transactionSubmitButton(#{${submitButtonText}})}"></button>
    </th:block>
</html>

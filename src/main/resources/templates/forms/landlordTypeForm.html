<!--/*@thymesVar id="formModel" type="java.lang.Object"*/-->
<!--/*@thymesVar id="fieldSetHeading" type="java.lang.String"*/-->
<!--/*@thymesVar id="partnershipSummary" type="java.lang.String"*/-->
<!--/*@thymesVar id="englishPartnershipHeading" type="java.lang.String"*/-->
<!--/*@thymesVar id="englishPartnershipParagraphOne" type="java.lang.String"*/-->
<!--/*@thymesVar id="englishPartnershipParagraphTwo" type="java.lang.String"*/-->
<!--/*@thymesVar id="llpPartnershipHeading" type="java.lang.String"*/-->
<!--/*@thymesVar id="llpPartnershipParagraph" type="java.lang.String"*/-->
<!--/*@thymesVar id="backUrl" type="java.lang.String"*/-->
<!--/*@thymesVar id="radioOptions" type="java.lang.Object"*/-->
<!DOCTYPE html>
<html id="form-content"
      th:replace="~{fragments/forms/questionPage :: questionPage(#{${fieldSetHeading}}, ${formModel}, ~{::#form-content/content()}, ${backUrl}, ${sectionHeaderInfo})}">
    <th:block id="fieldset-content"
              th:replace="~{fragments/forms/fieldSet :: fieldSet(~{::#fieldset-content/content()}, 'landlordType', #{${fieldSetHeading}}, null)}">
        <details id="details" th:replace="~{fragments/details :: details(#{${partnershipSummary}}, ~{::#details/content()})}">
            <div class="govuk-details__text">
                <h3 class="govuk-heading-m" th:text="#{${englishPartnershipHeading}}"></h3>
                <p class="govuk-body" th:utext="#{${englishPartnershipParagraphOne}}"></p>
                <p class="govuk-body" th:text="#{${englishPartnershipParagraphTwo}}"></p>
                <h3 class="govuk-heading-m" th:text="#{${llpPartnershipHeading}}"></h3>
                <p class="govuk-body" th:utext="#{${llpPartnershipParagraph}}"></p>
            </div>
        </details>
        <th:block th:replace="~{fragments/forms/radios :: radios(null,'landlordType',null, ${radioOptions})}"></th:block>
    </th:block>
    <div class="govuk-button-group">
        <button th:replace="~{fragments/buttons/primaryButton :: primaryButton(#{forms.buttons.continue})}"></button>
    </div>
</html>

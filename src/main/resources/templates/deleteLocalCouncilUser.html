<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(#{deleteLocalCouncilUser.pageTitle(${user.name})}, ~{::main/content()}, false, ${backLinkPath}, null)}">
<main>
    <div id="page-content" th:replace="~{fragments/layouts/twoThirdsLayout :: twoThirdsLayout(~{::#page-content/content()})}">
    <header id="header">
        <h1 class="govuk-heading-l" th:text="#{deleteLocalCouncilUser.heading}">deleteLocalCouncilUser.heading</h1>
    </header>
    <section data-testid="user-details-section">
        <p class="govuk-body">
            <strong th:text="${user.name}">user.name</strong>
        </p>
        <p class="govuk-body">
            <strong th:text="#{deleteLocalCouncilUser.emailLabel}+':'">deleteLocalCouncilUser.emailLabel:</strong>
            <span th:text="${user.email}" th:remove="tag">user.email</span>
        </p>
    </section>
    <hr class="govuk-section-break govuk-section-break--m">
    <section>
        <p class="govuk-body" th:text="#{deleteLocalCouncilUser.para.one}">deleteLocalCouncilUser.para.one</p>
        <p class="govuk-body" th:text="#{deleteLocalCouncilUser.para.two}">deleteLocalCouncilUser.para.two</p>
        <p class="govuk-body" th:text="#{deleteLocalCouncilUser.para.three}">deleteLocalCouncilUser.para.three</p>
    </section>
    <form method="post" th:action="@{''}">
        <button th:replace="~{fragments/buttons/warningButton :: warningButton(buttonText=#{deleteLocalCouncilUser.deleteAccountButton})}"></button>
    </form>
    </div>
</main>
</html>

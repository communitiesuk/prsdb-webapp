<!DOCTYPE html>
<html id="form-content" th:replace="~{fragments/forms/questionPage :: questionPage(#{registerProperty.deleteIncompleteProperties.incompleteProperties.title}, ${formModel}, ~{::#form-content/content()}, ${backUrl}, null)}">
    <th:block id="fieldset-content" th:replace="~{fragments/forms/fieldSet :: fieldSet(~{::#fieldset-content/content()}, 'wantsToProceed', #{registerProperty.deleteIncompleteProperties.areYouSure.heading(${singleLineAddress})}, null)}">
        <th:block th:replace="~{fragments/forms/radios :: radios(null, 'wantsToProceed', null, ${radioOptions})}"></th:block>
    </th:block>
    <button th:replace="~{fragments/buttons/primaryButton :: primaryButton(#{forms.buttons.continue})}"></button>
</html>

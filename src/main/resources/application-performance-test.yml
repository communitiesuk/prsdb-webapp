spring:
  config:
    activate:
      on-profile: performance-test

gov-uk-pay:
  base-url: http://localhost:${server.port:8080}/local/gov-uk-pay
  api-key: performance-test
  mock-base-url: ${GOV_UK_PAY_MOCK_BASE_URL}
  mock-card-entry-delay-seconds: 0
  mock-failing-calls-from-capture: 0
  mock-failing-capture-takes-payment: false

---
spring:
  config:
    activate:
      on-profile: "performance-test & nft & !production"
  security:
    oauth2:
      client:
        registration:
          epc-register:
            client-id: performance-test
            client-secret: performance-test
        provider:
          epc-register:
            token-uri: http://localhost:${server.port:8080}/local/epc/auth/oauth/token

epc:
  base-url: http://localhost:${server.port:8080}/local/epc
  certificate-base-url: http://localhost:${server.port:8080}/local/epc/energy-certificate

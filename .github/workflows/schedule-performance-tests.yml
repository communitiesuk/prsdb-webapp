name: Schedule Performance Tests
on:
  schedule:
    - cron: '0 19 * * *'

permissions:
  actions: write

jobs:
  dispatch:
    name: Dispatch performance tests on nft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run performance tests from the nft branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run run-performance-tests.yml --repo "$GITHUB_REPOSITORY" --ref nft

name: Build and Test
on:
  pull_request:
  merge_group:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check line endings
        run: |
          bad=$(git ls-files --eol | awk -F'\t' '$1 ~ /^i\/(crlf|mixed)/ { print $2 }')
          if [ -n "$bad" ]; then
            echo "Files with CRLF or mixed line endings in the git index:"
            echo "$bad"
            echo ""
            echo "Fix by running 'git add --renormalize .' and committing the result."
            exit 1
          fi

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: 21
          cache: 'gradle'

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Run npm tests
        run: npm test

      - name: Generate test OneLogin keys
        run: |
          openssl genrsa -out src/main/resources/private_key.pem 2048
          openssl rsa -in src/main/resources/private_key.pem -pubout -out src/main/resources/public_key.pem

      - name: Run tests for shard ${{ matrix.shard }}
        env:
          EMAILNOTIFICATIONS_APIKEY: ${{ secrets.NOTIFY_KEY }}
          EMAILNOTIFICATIONS_USE_PRODUCTION_NOTIFY: ${{ github.base_ref == 'production' || github.merge_group.base_ref == 'refs/head/production' }}
        run: ./gradlew clean test --no-daemon -PshardIndex=${{ matrix.shard }} -PshardCount=4

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: 21
          cache: 'gradle'

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Run ktlintCheck
        run: ./gradlew ktlintCheck --no-daemon

      - name: Run ktlintFormat
        run: ./gradlew ktlintFormat --no-daemon

  # Single required status check, so the shard count can change without touching branch protection.
  all-tests:
    name: All tests passed
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All shards and lint passed"

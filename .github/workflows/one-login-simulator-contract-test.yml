name: One Login Simulator Contract Test
on:
  workflow_call:

jobs:
  simulator-contract-test:
    name: One Login simulator contract test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: 21
          cache: 'gradle'

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - name: Run official simulator contract tests
        run: ./gradlew oneLoginSimulatorContractTest --no-daemon --console=plain

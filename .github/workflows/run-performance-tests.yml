        run: |
          node --input-type=module - "$RUNNER_TEMP/nft-joint-fixtures.json" "$RUNNER_TEMP/nft-ramp-joint.json" <<'NODE'
          import {readFileSync, writeFileSync} from 'node:fs';
          const [currentPath, rampPath] = process.argv.slice(2);
          const current = JSON.parse(readFileSync(currentPath, 'utf8'));

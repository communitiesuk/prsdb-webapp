          RAMPED_JOURNEYS: ${{ steps.rampedJourneys.outcome }}
          RAMP_PREP_0: ${{ steps.exportRampTeamPreparation.outcome }}
          RAMP_PREP_1: ${{ steps.prepareRampTeam.outcome }}
          RAMP_PREP_2: ${{ steps.exportRampTeam.outcome }}

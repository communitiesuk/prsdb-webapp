name: NFT runner-access diagnostic only
on:
  workflow_dispatch:

concurrency:
  group: nft-app-service-operation
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  admission:
    if: github.ref == 'refs/heads/chore/PDJB-553-nft-runner-access-check'
    environment: nft
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AWS_PAGER: ""
      PROBE_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Configure narrowly scoped NFT credentials
        id: credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::448120078528:role/nft-performance-test-orchestrator-access
          role-session-name: nft-admission-${{ github.run_id }}
          aws-region: eu-west-2
          role-duration-seconds: 900
      - name: Create bounded network-only utility
        run: |
          cat > "$RUNNER_TEMP/nft-runner-access.py" <<'PY'
          import datetime
          import ipaddress
          import json
          import os
          from pathlib import Path
          import re
          import signal
          import subprocess
          import sys
          import time

          os.umask(0o077)
          state_path = Path(os.environ["RUNNER_TEMP"]) / "nft-runner-access-owned.json"
          origin = "https://nft.register-home-to-rent.test.communities.gov.uk"
          marker = os.environ["PROBE_RUN"]

          def aws(service, operation, data=None, region="eu-west-2"):
              result = subprocess.run(
                  ["aws", service, operation, "--region", region, "--output", "json",
                   "--no-cli-pager", "--cli-connect-timeout", "10", "--cli-read-timeout", "15",
                   "--cli-input-json", json.dumps(data or {})],
                  capture_output=True, text=True, timeout=30)
              if result.returncode:
                  match = re.search(r"An error occurred \(([A-Za-z0-9]+)\)", result.stderr)
                  raise RuntimeError(f"{service}/{operation}: {match.group(1) if match else 'command failed'}")
              return json.loads(result.stdout)

          def save(entries):
              state_path.write_text(json.dumps(entries))

          def cleanup():
              entries = json.loads(state_path.read_text()) if state_path.exists() else []
              remaining = list(entries)
              for entry in entries:
                  for attempt in range(4):
                      try:
                          current = aws("wafv2", "get-ip-set", entry["input"], entry["region"])
                          addresses = current["IPSet"]["Addresses"]
                          if entry["cidr"] in addresses:
                              aws("wafv2", "update-ip-set", {
                                  **entry["input"], "LockToken": current["LockToken"],
                                  "Addresses": [value for value in addresses if value != entry["cidr"]]
                              }, entry["region"])
                          verified = aws("wafv2", "get-ip-set", entry["input"], entry["region"])
                          if entry["cidr"] in verified["IPSet"]["Addresses"]:
                              raise RuntimeError("Owned runner entry still present")
                          remaining.remove(entry)
                          save(remaining)
                          print(f"Cleanup verified: {entry['input']['Scope']}", flush=True)
                          break
                      except (RuntimeError, subprocess.TimeoutExpired):
                          if attempt == 3:
                              raise RuntimeError(f"Cleanup failed for {entry['input']['Scope']}") from None
                          time.sleep(2)

          def probe(label):
              statuses = []
              for client in ("curl", "node"):
                  url = f"{origin}/healthcheck?runner_access_probe={marker}-{label}-{client}"
                  if client == "curl":
                      command = ["curl", "--ipv4", "--silent", "--show-error",
                                 "--connect-timeout", "5", "--max-time", "10",
                                 "--output", "/dev/null", "--write-out", "%{http_code}", url]
                  else:
                      script = (
                          'try { const r = await fetch(process.argv[1], {redirect:"manual",'
                          'signal:AbortSignal.timeout(10000)}); console.log(r.status); }'
                          'catch { console.log("000"); }')
                      command = ["node", "--input-type=module", "-e", script, url]
                  try:
                      result = subprocess.run(command, capture_output=True, text=True, timeout=12)
                      status = result.stdout.strip()
                      status = status if re.fullmatch(r"\d{3}", status) else "000"
                  except subprocess.TimeoutExpired:
                      status = "000"
                  statuses.append(status)
                  stamp = datetime.datetime.now(datetime.timezone.utc).isoformat()
                  print(f"{stamp} probe={marker}-{label}-{client} status={status}", flush=True)
              return statuses == ["200", "200"]

          def admission():
              if aws("sts", "get-caller-identity")["Account"] != "448120078528":
                  raise RuntimeError("Wrong AWS account")
              result = subprocess.run(
                  ["curl", "--ipv4", "--fail", "--silent", "--show-error",
                   "--connect-timeout", "5", "--max-time", "10", "https://checkip.amazonaws.com"],
                  capture_output=True, text=True, timeout=12)
              address = str(ipaddress.IPv4Address(result.stdout.strip()))
              if result.returncode or not ipaddress.ip_address(address).is_global:
                  raise RuntimeError("Invalid public runner IPv4")
              print(f"::add-mask::{address}", flush=True)
              cidr = f"{address}/32"
              owned = []
              save(owned)
              print(f"Network-only canary {marker}; IPv4 captured and masked; no app or DB mutations.", flush=True)
              if probe("before"):
                  print("INCONCLUSIVE: runner already admitted before IP-set updates.", flush=True)
                  return
              for scope, region, name in [
                  ("CLOUDFRONT", "us-east-1", "waf-performance-runner-cloudfront-nft"),
                  ("REGIONAL", "eu-west-2", "waf-performance-runner-regional-nft")
              ]:
                  listed = aws("wafv2", "list-ip-sets", {"Scope": scope}, region)
                  matches = [value for value in listed["IPSets"] if value["Name"] == name]
                  if len(matches) != 1:
                      raise RuntimeError("Missing or ambiguous existing runner IP set")
                  identity = {"Name": name, "Scope": scope, "Id": matches[0]["Id"]}
                  current = aws("wafv2", "get-ip-set", identity, region)
                  if current["IPSet"]["IPAddressVersion"] != "IPV4":
                      raise RuntimeError("Unexpected IP-set address family")
                  if cidr not in current["IPSet"]["Addresses"]:
                      entry = {"input": identity, "region": region, "cidr": cidr}
                      owned.append(entry)
                      save(owned)
                      try:
                          aws("wafv2", "update-ip-set", {
                              **identity, "LockToken": current["LockToken"],
                              "Addresses": current["IPSet"]["Addresses"] + [cidr]
                          }, region)
                      except RuntimeError as error:
                          if "WAFOptimisticLockException" in str(error):
                              owned.remove(entry)
                              save(owned)
                          raise
                  verified = aws("wafv2", "get-ip-set", identity, region)
                  if cidr not in verified["IPSet"]["Addresses"]:
                      raise RuntimeError("Runner entry missing after update")
                  print(f"{scope}: exact runner /32 membership verified.", flush=True)
              consecutive = 0
              for attempt in range(12):
                  consecutive = consecutive + 1 if probe(f"after-{attempt}") else 0
                  if consecutive == 2:
                      print("PASS: both IPv4 curl and original-style Node fetch admitted twice.", flush=True)
                      return
                  if attempt < 11:
                      time.sleep(10)
              raise RuntimeError("FAIL: no two consecutive successful admissions within bounded probes")

          def interrupted(signum, frame):
              raise RuntimeError("Probe interrupted; removing owned entries")

          signal.signal(signal.SIGTERM, interrupted)
          signal.signal(signal.SIGINT, interrupted)
          try:
              if sys.argv[1] == "cleanup":
                  cleanup()
              else:
                  try:
                      admission()
                  finally:
                      cleanup()
          except Exception as error:
              detail = str(error) if isinstance(error, RuntimeError) else "Diagnostic operation failed"
              print(f"::error::{type(error).__name__}: {detail}", flush=True)
              sys.exit(1)
          PY
      - name: Probe admission without restoring data or starting load
        run: python3 "$RUNNER_TEMP/nft-runner-access.py" probe
      - name: Independently retry owned-entry cleanup
        if: always() && steps.credentials.outcome == 'success'
        run: |
          if [ -f "$RUNNER_TEMP/nft-runner-access.py" ]; then
            python3 "$RUNNER_TEMP/nft-runner-access.py" cleanup
          fi

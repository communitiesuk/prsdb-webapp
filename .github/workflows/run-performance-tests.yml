          RAMP_PREP_8: ${{ steps.exportRampJointAcceptance.outcome }}
          RAMP_PREP_9: ${{ steps.exportRampOffboarding.outcome }}
          POST_RAMP_CREDENTIALS: ${{ steps.refreshPostRampCredentials.outcome }}
          RESTORED_0: ${{ steps.organisationRegistrations.outcome }}
          EXPORT_SEQUENTIAL_TEAM: ${{ steps.exportSequentialTeamPreparation.outcome }}
          RESTORED_1: ${{ steps.prepareOrganisationInvitations.outcome }}

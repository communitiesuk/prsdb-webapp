          import {readFileSync} from 'node:fs';
          const [currentPath, profilesPath, rampPath] = process.argv.slice(2);
          const read = path => JSON.parse(readFileSync(path, 'utf8'));
          const current = read(currentPath);
          const reserved = [...read(profilesPath), ...read(rampPath)];
          if (current.length !== 17 || current.some(row => reserved.some(used =>
            used.organisationId === row.organisationId || used.subject === row.subject))) {
            throw new Error('Sequential organisation team actors overlap concurrent or profile actors');
          }
          NODE
          ./gradlew gatlingRun --no-daemon --non-interactive \

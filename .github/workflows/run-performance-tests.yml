            "Refresh post-ramp credentials:$POST_RAMP_CREDENTIALS" \
            "Register new organisations:$RESTORED_0" \
            "Export sequential organisation administrators:$EXPORT_SEQUENTIAL_TEAM" \
            "Prepare organisation team invitations:$RESTORED_1" \
            "Export prepared organisation team invitations:$RESTORED_2" \
            "Accept organisation team invitations:$RESTORED_3" \
            "Change organisation team access:$RESTORED_4" \
            "Export operator fixtures:$RESTORED_5" \
            "Run operator operations:$RESTORED_6" \
            "Export letting-agent fixtures:$RESTORED_7" \
            "Prepare letting-agent invitations:$RESTORED_8" \
            "Export prepared letting-agent invitations:$RESTORED_9" \
            "Access and update delegated properties:$RESTORED_10" \
            "Export joint-landlord fixtures:$RESTORED_11" \
            "Prepare joint-landlord invitations:$RESTORED_12" \
            "Export prepared joint-landlord invitations:$RESTORED_13" \
            "Accept joint-landlord invitations:$RESTORED_14" \
            "Export property deregistration fixtures:$RESTORED_15" \
            "Deregister exclusive properties:$RESTORED_16"; do
            name="${stage%%:*}"
            outcome="${stage#*:}"
            printf '%s: %s\n' "$name" "$outcome"
            if [[ "$outcome" != "success" ]]; then
              failed=true
            fi
          done
          {
            echo '### PDJB-553 established NFT baseline'
            echo 'Concurrent families include landlord registration, saved registration, completed-property and organisation profile updates, gas/electrical certificates, organisation registration/team, joint acceptance, agent access/update, operator and property deregistration.'
            echo 'Offered profile: landlord registration 26/minute; saved, completed-property and organisation profile updates 4/minute each; six additional families 1/minute each (organisation registration/team share one arrival). Five-minute ramp and fifteen-minute hold: 767 starts. Landlord registration is a provisional proxy, NOT paid property-registration forecast fulfilment.'
            echo 'Gates: zero failed requests and expected successful completions for every included ramp family. Mean/max timings are calibration evidence, not agreed SLO thresholds.'
            echo 'Sequential correctness stages additionally exercise organisation registration and team operations, joint invitation acceptance, letting-agent access and update, operator operations and property deregistration. Their earlier local proof is not NFT acceptance.'
            echo 'Paid property registration and EPC-dependent/public-probe scenarios and council journeys remain excluded.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$failed" == "true" ]]; then
            echo "::error::One or more journey stages failed; see the per-stage outcomes above."
            exit 1
          fi
      - name: Upload Gatling report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gatling-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/gatling/**
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve recovery state
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nft-readiness-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nft-state.json
          if-no-files-found: error
          retention-days: 7

  stop-writers-for-reset:
    name: Restore environment and stop actual writers before reset
    needs: [changes, restore-dataset, performance-tests]
    if: >-
      always() && needs.changes.result == 'success' &&
      needs.changes.outputs.run == 'true'
    environment: nft
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      NFT_RESTORE_TASK_DEFINITION: ${{ inputs.restore-task-definition || vars.NFT_RESTORE_TASK_DEFINITION }}
      READINESS_STATE_REQUIRED: ${{ needs.performance-tests.result != 'skipped' && needs.performance-tests.outputs.preparation-outcome != 'skipped' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          pattern: nft-*-state-${{ github.run_id }}-${{ github.run_attempt }}
          merge-multiple: true
          path: ${{ runner.temp }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::448120078528:role/nft-performance-test-orchestrator-access
          role-session-name: nft-before-reset-${{ github.run_id }}
          aws-region: eu-west-2
          role-duration-seconds: 3600
      - name: Stop owned worker, restore simulator configuration and stop actual writers
        run: node scripts/performance-tests/nft-vpc-restore.mjs cleanup

  reset-database:
    name: Reset NFT database
    needs: [changes, stop-writers-for-reset]
    if: >-
      always() && needs.changes.result == 'success' &&
      needs.changes.outputs.run == 'true' &&
      needs.stop-writers-for-reset.result == 'success'
    uses: ./.github/workflows/reset-database.yml
    with:
      environment: nft
      aws-account-id: 448120078528
      checkout-ref: ${{ github.sha }}
    permissions:
      contents: read
      id-token: write

  restore-app-after-database-reset:
    name: Start NFT app and verify all QA fixtures after reset
    needs: [changes, reset-database]
    if: >-
      always() && needs.changes.result == 'success' &&
      needs.changes.outputs.run == 'true' &&
      needs.reset-database.result == 'success'
    environment: nft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: nft-restore-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}
      - name: Configure NFT runner credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::448120078528:role/nft-performance-test-orchestrator-access
          role-session-name: nft-reset-recovery-${{ github.run_id }}
          aws-region: eu-west-2
          role-duration-seconds: 3600
      - name: Start NFT app and verify rollout and ALB health
        env:
          NFT_RESTORE_STATE_PATH: ${{ runner.temp }}/nft-restore-state.json
        run: node scripts/performance-tests/nft-vpc-restore.mjs start-after-reset
      - name: Verify the exact QA properties and required links
        uses: ./.github/actions/verify-nft-database
        with:
          mode: qa

  restore-async-after-database-reset:
    name: Restore async service after QA reset
    needs: [changes, reset-database, restore-app-after-database-reset]
    if: >-
      always() && needs.changes.result == 'success' &&
      needs.changes.outputs.run == 'true' &&
      needs.reset-database.result == 'success'
    environment: nft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      NFT_RESTORE_TASK_DEFINITION: ${{ inputs.restore-task-definition || vars.NFT_RESTORE_TASK_DEFINITION }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: nft-restore-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::448120078528:role/nft-performance-test-orchestrator-access
          role-session-name: nft-async-recovery-${{ github.run_id }}
          aws-region: eu-west-2
          role-duration-seconds: 3600
      - name: Restore the recorded async service count
        run: node scripts/performance-tests/nft-vpc-restore.mjs restore-async

  marker:
    name: Record successful NFT head
    needs: [changes, performance-tests, reset-database, restore-app-after-database-reset, restore-async-after-database-reset]
    if: >-
      always() && needs.changes.result == 'success' &&
      (inputs.expected-app-sha == '' || inputs.expected-app-sha == needs.changes.outputs.sha) &&
      ((needs.performance-tests.result == 'success' && needs.reset-database.result == 'success' &&
      needs.restore-app-after-database-reset.result == 'success' && needs.restore-async-after-database-reset.result == 'success') ||
      (needs.performance-tests.result == 'skipped' && needs.reset-database.result == 'skipped' &&
      needs.restore-app-after-database-reset.result == 'skipped' && needs.restore-async-after-database-reset.result == 'skipped' &&
      needs.changes.outputs.run == 'false'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write NFT SHA marker
        env:
          NFT_SHA: ${{ needs.changes.outputs.sha }}
        run: printf '%s\n' "$NFT_SHA" > nft-head-sha.txt
      - uses: actions/upload-artifact@v7
        with:
          name: nft-head-sha
          path: nft-head-sha.txt
          retention-days: 30

          import {readFileSync, writeFileSync} from 'node:fs';
          const [preparedPath, currentPath] = process.argv.slice(2);
          const prepared = JSON.parse(readFileSync(preparedPath, 'utf8')).slice(0, 17);
          const current = JSON.parse(readFileSync(currentPath, 'utf8'));
          const byId = new Map(current.map(row => [row.organisationId, row]));
          const selected = prepared.map(row => byId.get(row.organisationId));
          const runId = `${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`;
          if (selected.length !== 17 || selected.some((row, i) => !row || row.subject !== prepared[i].subject ||
            row.invitedEmail !== `org-team-${runId}-${row.organisationId}-kept@example.com`)) {
            throw new Error('Prepared organisation invitations do not match re-exported tokens');
          }
          writeFileSync(currentPath, JSON.stringify(selected) + '\n', {mode: 0o600});
          NODE
          ./gradlew gatlingRun --no-daemon --non-interactive \

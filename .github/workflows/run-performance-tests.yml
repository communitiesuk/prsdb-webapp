        run: |
          node --input-type=module - "$RUNNER_TEMP/nft-offboarding-fixtures.json" "$RUNNER_TEMP/nft-ramp-offboarding.json" <<'NODE'
          import {readFileSync, writeFileSync} from 'node:fs';
          const [currentPath, rampPath] = process.argv.slice(2);
          const current = JSON.parse(readFileSync(currentPath, 'utf8'));
          const ramp = JSON.parse(readFileSync(rampPath, 'utf8')).slice(0, 17);
          const fields = ['subject', 'propertyOwnershipId'];
          const reserved = fields.map(field => new Set(ramp.map(row => row[field])));
          const fresh = current.filter(row => fields.every((field, i) => !reserved[i].has(row[field])));
          if (ramp.length !== 17 || fresh.length < 28) throw new Error('Insufficient correctness actors outside the concurrent allocation');

include classpath("application.conf")

queues {
  prsdb-email-queue {
    defaultVisibilityTimeout = 60 seconds
    deadLettersQueue {
      name = "prsdb-email-dead-letter-queue"
      maxReceiveCount = 10
    }
  }
  prsdb-email-dead-letter-queue {}
  prsdb-scan-result-queue {
    defaultVisibilityTimeout = 60 seconds
    deadLettersQueue {
      name = "prsdb-scan-result-dead-letter-queue"
      maxReceiveCount = 10
    }
  }
  prsdb-scan-result-dead-letter-queue {}
}

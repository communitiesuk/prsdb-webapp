<!doctype html>
<html lang="en">
<head>
    <meta name="robots" content="noindex">
    <meta charset="utf-8">
    <title>Update the organisation address journey map – journey map</title>
    <style>
        :root { --blue: #1d70b8; --grey: #f3f2f1; --border: #b1b4b6; --text: #0b0c0c; --secondary: #505a5f; --red: #d4351c; --yellow: #ffdd00; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: var(--text); height: 100vh; display: flex; flex-direction: column; }
        header { padding: 10px 16px; border-bottom: 4px solid var(--blue); display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
        header h1 { font-size: 20px; margin: 0; }
        .meta { color: var(--secondary); font-size: 13px; }
        .tools { margin-left: auto; display: flex; gap: 6px; align-items: center; }
        button, input { font: inherit; font-size: 14px; }
        button { background: var(--grey); border: 1px solid var(--border); padding: 4px 10px; cursor: pointer; }
        button.active { background: var(--blue); border-color: var(--blue); color: white; }
        main { flex: 1; display: flex; min-height: 0; }
        #graph-view { flex: 1; position: relative; overflow: hidden; cursor: grab; user-select: none; -webkit-user-select: none; }
        #graph-view.dragging { cursor: grabbing; }
        #graph { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
        #graph svg { max-width: none !important; }
        #graph g.node { cursor: pointer; }
        #graph g.node.match rect, #graph g.node.match polygon, #graph g.node.match path { stroke: #f47738 !important; stroke-width: 5px !important; }
        #graph g.node.selected rect, #graph g.node.selected polygon, #graph g.node.selected path, #graph g.node.selected circle { stroke: var(--yellow) !important; stroke-width: 8px !important; }
        #graph.focused g.node, #graph.focused path.flowchart-link, #graph.focused g.edgeLabel { opacity: 0.18; }
        #graph.focused g.node.related, #graph.focused path.flowchart-link.related, #graph.focused g.edgeLabel.related { opacity: 1; }
        #graph path.flowchart-link.edge-out { stroke: #1d70b8 !important; stroke-width: 4px !important; }
        #graph path.flowchart-link.edge-in { stroke: #4c2c92 !important; stroke-width: 4px !important; }
        #graph path.flowchart-link.edge-hover { stroke-width: 8px !important; }
        #graph g.node.hover-target rect, #graph g.node.hover-target polygon, #graph g.node.hover-target path, #graph g.node.hover-target circle { stroke: #f47738 !important; stroke-width: 6px !important; }
        #graph-missing { padding: 24px; color: var(--secondary); }
        #gallery-view { flex: 1; overflow: auto; padding: 16px; display: none; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
        .card { border: 1px solid var(--border); cursor: pointer; background: white; }
        .card.hidden { display: none; }
        .card img, .card .no-image { width: 100%; aspect-ratio: 16 / 10; display: block; border-bottom: 1px solid var(--border); object-fit: cover; object-position: top; }
        .card .no-image { background: var(--grey); color: var(--secondary); display: flex; align-items: center; justify-content: center; font-size: 13px; }
        .card .card-title { padding: 8px; font-size: 14px; }
        .badge { display: inline-block; font-size: 12px; padding: 1px 6px; margin-left: 4px; background: var(--grey); border: 1px solid var(--border); }
        .badge.gap { background: #fff7bf; }
        .badge.error { background: var(--red); color: white; border-color: var(--red); }
        .badge.start { background: #00703c; color: white; border-color: #00703c; }
        .entry-note { color: #00703c; font-weight: bold; margin: 4px 0; }
        .link-list { list-style: none; padding-left: 0 !important; }
        .link-list li { display: flex; gap: 10px; align-items: center; margin: 6px 0; }
        .link-list .thumb { width: 96px; height: 60px; flex: none; border: 1px solid var(--border); object-fit: cover; object-position: top; display: block; }
        .link-list .thumb.placeholder { display: flex; align-items: center; justify-content: center; background: var(--grey); color: var(--secondary); font-size: 11px; text-align: center; }
        aside { width: min(42vw, 640px); border-left: 1px solid var(--border); overflow: auto; padding: 16px; }
        aside h2 { font-size: 19px; margin: 0 0 4px; }
        aside h3 { font-size: 16px; margin: 16px 0 6px; }
        aside ul { padding-left: 18px; margin: 4px 0; }
        aside a { color: var(--blue); cursor: pointer; }
        .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin: 8px 0; }
        .conditions { background: var(--grey); padding: 8px 12px; font-size: 14px; margin: 8px 0; }
        .shot { width: 100%; border: 1px solid var(--border); display: block; }
        .issues table { border-collapse: collapse; font-size: 14px; margin-top: 8px; }
        .issues td, .issues th { border: 1px solid var(--border); padding: 4px 8px; text-align: left; }
        code { font-size: 13px; background: var(--grey); padding: 0 3px; }
        @media print {
            body { height: auto; display: block; }
            .tools, aside { display: none; }
            main { display: block; }
            #graph-view { overflow: visible; height: auto; }
            #graph { position: static; transform: none !important; }
            #gallery-view { display: block !important; overflow: visible; }
            .card { break-inside: avoid; }
        }
    </style>
</head>

:"ADDRESSES_FOUND","to":"select-address","walked":true,"reads":[]},{"from":"lookup-address","mode":"NO_ADDRESSES_FOUND","to":"no-address-found","walked":true,"reads":[]},{"from":"select-address","mode":"MANUAL_ADDRESS","to":"manual-address","walked":true,"reads":[]},{"from":"select-address","mode":"ADDRESS_ALREADY_REGISTERED","to":"/landlord/landlord-details","walked":true,"reads":[]},{"from":"select-address","mode":"ADDRESS_SELECTED","to":"/landlord/landlord-details","walked":true,"reads":[]},{"from":"no-address-found","mode":"COMPLETE","to":"manual-address","walked":true,"reads":[]},{"from":"manual-address","mode":"COMPLETE","to":"/landlord/landlord-details","walked":true,"reads":[]}],"entries":[{"node":"lookup-address","label":"Change Organisation address"}]};
</script>
<script>
    (() => {
        const nodes = manifest.nodes;
        const indexById = new Map(nodes.map((node, index) => [node.id, index]));
        const containerLabels = new Map(manifest.containers.map((container) => [container.id, container.label]));
        const entries = manifest.entries || [];
        const entryLabels = new Map(entries.map((entry) => [entry.node, entry.label]));
        const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
        const kindLabels = { page: "Page", decision: "Decision", terminal: "Leaves the journey" };

        const pageCount = nodes.filter((node) => node.kind !== "decision").length;
        const screenshotCount = nodes.reduce((total, node) => total + node.variants.length, 0);
        document.getElementById("meta").textContent =
            `${pageCount} pages · ${screenshotCount} screenshots · ${manifest.gaps.length} gaps · ${manifest.errors.length} errors · ` +
            `generated ${manifest.journey.generatedAt}${manifest.journey.gitCommit ? " at " + manifest.journey.gitCommit : ""}`;

        const view = document.getElementById("graph-view");
        const graph = document.getElementById("graph");
        const svg = graph.querySelector("svg");
        const nodeElements = new Map();
        let startElement = null;
        let scale = 1;
        let offsetX = 0;
        let offsetY = 0;

        const applyTransform = () => {
            graph.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
        };

        const naturalSize = () => {
            const box = svg.viewBox && svg.viewBox.baseVal;
            if (box && box.width) return { width: box.width, height: box.height };
            return { width: svg.clientWidth || 1000, height: svg.clientHeight || 1000 };
        };

        const fit = () => {
            if (!svg) return;
            const size = naturalSize();
            const scaleX = view.clientWidth / size.width;
            const scaleY = view.clientHeight / size.height;
            scale = Math.min(scaleX, scaleY, 1) * 0.95;
            offsetX = (view.clientWidth - size.width * scale) / 2;
            offsetY = 12;
            applyTransform();
        };

        const zoomAt = (factor, pointX, pointY) => {
            const newScale = Math.min(4, Math.max(0.03, scale * factor));
            offsetX = pointX - (pointX - offsetX) * (newScale / scale);
            offsetY = pointY - (pointY - offsetY) * (newScale / scale);
            scale = newScale;
            applyTransform();
        };

        const centreOn = (element) => {
            if (!element) return;
            const viewBox = view.getBoundingClientRect();
            const box = element.getBoundingClientRect();
            offsetX += viewBox.left + viewBox.width / 2 - (box.left + box.width / 2);
            offsetY += viewBox.top + viewBox.height / 2 - (box.top + box.height / 2);
            applyTransform();
        };

        if (svg) {
            const size = naturalSize();
            svg.setAttribute("width", size.width);
            svg.setAttribute("height", size.height);
            svg.style.maxWidth = "none";
            svg.querySelectorAll("g.node").forEach((element) => {
                const dataId = element.getAttribute("data-id");
                const match = (dataId && /^n(\d+)$/.exec(dataId)) || /flowchart-n(\d+)-/.exec(element.id);
                if (match) nodeElements.set(Number(match[1]), element);
            });
            startElement = svg.querySelector('g.node[id*="flowchart-journeyStart-"]');
            view.addEventListener("wheel", (event) => {
                event.preventDefault();
                const rect = view.getBoundingClientRect();
                zoomAt(Math.exp(-event.deltaY * 0.0015), event.clientX - rect.left, event.clientY - rect.top);
            }, { passive: false });
            let drag = null;
            view.addEventListener("mousedown", (event) => {
                if (event.button !== 0) return;
                drag = { startX: event.clientX, startY: event.clientY, offsetX, offsetY, moved: false, target: event.target };
                view.classList.add("dragging");
            });
            view.addEventListener("dragstart", (event) => event.preventDefault());
            window.addEventListener("mousemove", (event) => {
                if (!drag) return;
                const dx = event.clientX - drag.startX;
                const dy = event.clientY - drag.startY;
                if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
                offsetX = drag.offsetX + dx;
                offsetY = drag.offsetY + dy;
                applyTransform();
            });
            window.addEventListener("mouseup", () => {
                if (!drag) return;
                const { moved, target } = drag;
                drag = null;
                view.classList.remove("dragging");
                if (moved) return;
                const element = target.closest && target.closest("g.node");
                if (!element) return clearSelection();
                if (element === startElement) return selectStart(false);
                for (const [index, candidate] of nodeElements) {
                    if (candidate === element) select(index, false);
                }
            });
            requestAnimationFrame(fit);
        } else {
            graph.innerHTML = '<p id="graph-missing">The map could not be drawn. Use the Pages view instead.</p>';
        }

        const details = document.getElementById("details");
        const indexedEdges = manifest.edges.map((edge, index) => ({ edge, id: `e${index}` }));
        const edgeElements = (id) =>
            svg
                ? [svg.querySelector(`path[data-id="${id}"]`), svg.querySelector(`g.label[data-id="${id}"]`)?.closest("g.edgeLabel")].filter(Boolean)
                : [];
        const highlightClasses = ["related", "edge-out", "edge-in", "edge-hover", "hover-target", "selected"];
        const clearHighlight = () => {
            graph.classList.remove("focused");
            graph.querySelectorAll(highlightClasses.map((name) => "." + name).join(",")).forEach((element) => element.classList.remove(...highlightClasses));
        };
        // Links are { id, other }: the arrow's id in the SVG and the index of the node at its other end
        const highlight = (element, outgoing, incoming) => {
            clearHighlight();
            if (!svg) return;
            graph.classList.add("focused");
            if (element) element.classList.add("selected", "related");
            const mark = (links, edgeClass) =>
                links.forEach(({ id, other }) => {
                    edgeElements(id).forEach((part) => part.classList.add("related", edgeClass));
                    const otherElement = nodeElements.get(other);
                    if (otherElement) otherElement.classList.add("related");
                });
            mark(outgoing, "edge-out");
            mark(incoming, "edge-in");
        };
        const defaultDetails = details.innerHTML;
        const clearSelection = () => {
            clearHighlight();
            details.innerHTML = defaultDetails;
        };

        const thumbnailFor = (otherIndex) => {
            const other = nodes[otherIndex];
            const thumbnail = other && other.variants[0] && other.variants[0].thumbnail;
            if (thumbnail) return `<img class="thumb" src="${escapeHtml(thumbnail)}" alt="" loading="lazy">`;
            const text = !other ? "Elsewhere" : other.kind === "decision" ? "Decision" : other.kind === "terminal" ? "Leaves the journey" : "Not reached";
            return `<span class="thumb placeholder">${text}</span>`;
        };
        const linkItem = (id, otherIndex, title, label, badge) =>
            `<li data-edge="${id}" data-other="${otherIndex ?? ""}"><a data-node="${otherIndex ?? ""}">${thumbnailFor(otherIndex)}</a>` +
            `<span><a data-node="${otherIndex ?? ""}">${escapeHtml(title)}</a>${label ? ` <span class="meta">(${escapeHtml(label)})</span>` : ""}${badge}</span></li>`;
        const edgeItems = (links, end) =>
            links
                .map(({ edge, id }) => {
                    const otherIndex = indexById.get(edge[end]);
                    const title = otherIndex === undefined ? edge[end] : nodes[otherIndex].title;
                    const badge = edge.kind === "observed" ? "" : ` <span class="badge">${escapeHtml(edge.kind)}</span>`;
                    return linkItem(id, otherIndex, title, edge.label, badge);
                })
                .join("");
        const bindLinks = () => {
            details.querySelectorAll("li[data-edge]").forEach((item) => {
                item.addEventListener("mouseenter", () => {
                    edgeElements(item.dataset.edge).forEach((part) => part.classList.add("edge-hover"));
                    const other = item.dataset.other === "" ? null : nodeElements.get(Number(item.dataset.other));
                    if (other) other.classList.add("hover-target");
                });
                item.addEventListener("mouseleave", () => {
                    edgeElements(item.dataset.edge).forEach((part) => part.classList.remove("edge-hover"));
                    graph.querySelectorAll(".hover-target").forEach((element) => element.classList.remove("hover-target"));
                });
            });
            details.querySelectorAll("a[data-node]").forEach((link) => {
                link.addEventListener("click", () => {
                    if (link.dataset.node !== "") select(Number(link.dataset.node), true);
                });
            });
        };

        const renderVariant = (node, variantIndex) => {
            const variant = node.variants[variantIndex];
            const conditions = variant.conditions.length
                ? "<strong>Shown when:</strong><ul>" + variant.conditions.map((c) => `<li>${escapeHtml(c.step)}: <strong>${escapeHtml(c.answer)}</strong></li>`).join("") + "</ul>"
                : "Shown on the default route.";
            const origin = variant.origin === "change" ? '<p class="meta">Seen while changing an answer from a check your answers page.</p>' : "";
            const mobile = variant.mobileImage ? `<p><a href="${escapeHtml(variant.mobileImage)}" target="_blank">Mobile screenshot</a></p>` : "";
            return `<a href="${escapeHtml(variant.image)}" target="_blank"><img class="shot" src="${escapeHtml(variant.image)}" alt="Screenshot of ${escapeHtml(node.title)}"></a>` +
                `<div class="conditions">${conditions}</div>${origin}${mobile}`;
        };

        const select = (index, centre) => {
            const node = nodes[index];
            if (!node) return;
            const outgoing = indexedEdges.filter(({ edge }) => edge.from === node.id);
            const incoming = indexedEdges.filter(({ edge }) => edge.to === node.id);
            highlight(
                nodeElements.get(index),
                outgoing.map(({ edge, id }) => ({ id, other: indexById.get(edge.to) })),
                incoming.map(({ edge, id }) => ({ id, other: indexById.get(edge.from) })),
            );
            if (centre) centreOn(nodeElements.get(index));
            const entryIndex = entries.findIndex((entry) => entry.node === node.id);
            if (entryIndex >= 0 && svg) {
                edgeElements(`s${entryIndex}`).forEach((part) => part.classList.add("related", "edge-in"));
                if (startElement) startElement.classList.add("related");
            }
            const containers = node.containers.map((id) => containerLabels.get(id) || id).join(" › ");
            const gaps = manifest.gaps.filter((gap) => gap.node === node.id);
            const errors = manifest.errors.filter((error) => error.node === node.id);
            const entryLabel = entryLabels.get(node.id);
            const tabs = node.variants.length > 1
                ? '<div class="tabs">' + node.variants.map((variant, i) => `<button type="button" data-variant="${i}" class="${i === 0 ? "active" : ""}">Version ${i + 1}</button>`).join("") + "</div>"
                : "";
            details.innerHTML =
                `<h2>${escapeHtml(node.title)}</h2>` +
                (entryLabels.has(node.id) ? `<p class="entry-note">Entry point${entryLabel ? ": " + escapeHtml(entryLabel) : ""}</p>` : "") +
                `<p class="meta">${kindLabels[node.kind] || node.kind}${node.route ? ` · <code>${escapeHtml(node.route)}</code>` : ""}${node.stepConfig ? ` · ${escapeHtml(node.stepConfig)}` : ""}</p>` +
                (containers ? `<p class="meta">${escapeHtml(containers)}</p>` : "") +
                (gaps.length ? "<h3>Gaps</h3><ul>" + gaps.map((gap) => `<li>${escapeHtml(gap.mode || "")} ${escapeHtml(gap.reason)}</li>`).join("") + "</ul>" : "") +
                (errors.length ? "<h3>Errors</h3><ul>" + errors.map((error) => `<li>${escapeHtml(error.kind)}: ${escapeHtml(error.detail)}</li>`).join("") + "</ul>" : "") +
                (node.variants.length ? `<h3>Screenshots</h3>${tabs}<div id="variant"></div>` : "<p>This page was not reached by the generator.</p>") +
                (outgoing.length ? `<h3>Leads to</h3><ul class="link-list">${edgeItems(outgoing, "to")}</ul>` : "") +
                (incoming.length ? `<h3>Reached from</h3><ul class="link-list">${edgeItems(incoming, "from")}</ul>` : "");
            if (node.variants.length) {
                const variantContainer = details.querySelector("#variant");
                variantContainer.innerHTML = renderVariant(node, 0);
                details.querySelectorAll("button[data-variant]").forEach((button) => {
                    button.addEventListener("click", () => {
                        details.querySelectorAll("button[data-variant]").forEach((other) => other.classList.remove("active"));
                        button.classList.add("active");
                        variantContainer.innerHTML = renderVariant(node, Number(button.dataset.variant));
                    });
                });
            }
            bindLinks();
        };

        const selectStart = (centre) => {
            if (!entries.length) return;
            highlight(startElement, entries.map((entry, index) => ({ id: `s${index}`, other: indexById.get(entry.node) })), []);
            if (centre && startElement) {
                scale = 1;
                applyTransform();
                centreOn(startElement);
            }
            details.innerHTML =
                '<h2>Start</h2><p class="meta">Where users enter this journey</p><h3>Entry points</h3><ul class="link-list">' +
                entries
                    .map((entry, index) => {
                        const otherIndex = indexById.get(entry.node);
                        return linkItem(`s${index}`, otherIndex, otherIndex === undefined ? entry.node : nodes[otherIndex].title, entry.label, "");
                    })
                    .join("") +
                "</ul>";
            bindLinks();
        };

        const gallery = document.getElementById("gallery");
        nodes.forEach((node, index) => {
            if (node.kind === "decision") return;
            const card = document.createElement("div");
            card.className = "card";
            card.dataset.index = index;
            const thumbnail = node.variants[0] && node.variants[0].thumbnail;
            const gapCount = manifest.gaps.filter((gap) => gap.node === node.id).length;
            const errorCount = manifest.errors.filter((error) => error.node === node.id).length;
            card.innerHTML =
                (thumbnail ? `<img src="${escapeHtml(thumbnail)}" alt="" loading="lazy">` : '<div class="no-image">Not reached</div>') +
                `<div class="card-title">${escapeHtml(node.title)}` +
                (node.variants.length > 1 ? `<span class="badge">${node.variants.length} versions</span>` : "") +
                (entryLabels.has(node.id) ? '<span class="badge start">Start</span>' : "") +
                (gapCount ? '<span class="badge gap">gap</span>' : "") +
                (errorCount ? '<span class="badge error">error</span>' : "") +
                "</div>";
            card.addEventListener("click", () => select(index, false));
            gallery.appendChild(card);
        });

        const issueTable = (title, rows, columns) =>
            rows.length
                ? `<h3>${title}</h3><table><tr>${columns.map((c) => `<th>${c}</th>`).join("")}</tr>` +
                  rows.map((row) => `<tr>${row.map((cell) => `<td>${escapeHtml(cell)}</td>`).join("")}</tr>`).join("") + "</table>"
                : "";
        document.getElementById("issues").innerHTML =
            issueTable("Gaps", manifest.gaps.map((gap) => [gap.node, gap.mode || "", gap.reason]), ["Page", "Answer", "Reason"]) +
            issueTable("Errors", manifest.errors.map((error) => [error.node, error.kind, error.detail]), ["Page", "Kind", "Detail"]);

        const mapButton = document.getElementById("map-button");
        const pagesButton = document.getElementById("pages-button");
        const showView = (showMap) => {
            document.getElementById("graph-view").style.display = showMap ? "block" : "none";
            document.getElementById("gallery-view").style.display = showMap ? "none" : "block";
            mapButton.classList.toggle("active", showMap);
            pagesButton.classList.toggle("active", !showMap);
        };
        mapButton.addEventListener("click", () => showView(true));
        pagesButton.addEventListener("click", () => showView(false));
        if (!svg) showView(false);

        document.getElementById("fit-button").addEventListener("click", fit);
        const startButton = document.getElementById("start-button");
        if (!svg || !entries.length) startButton.hidden = true;
        startButton.addEventListener("click", () => selectStart(true));
        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && event.target !== document.getElementById("search")) clearSelection();
        });
        document.getElementById("zoom-in").addEventListener("click", () => zoomAt(1.25, view.clientWidth / 2, view.clientHeight / 2));
        document.getElementById("zoom-out").addEventListener("click", () => zoomAt(0.8, view.clientWidth / 2, view.clientHeight / 2));

        document.getElementById("download-svg").addEventListener("click", () => {
            if (!svg) return;
            const blob = new Blob([new XMLSerializer().serializeToString(svg)], { type: "image/svg+xml" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `${manifest.journey.name}-journey-map.svg`;
            link.click();
            URL.revokeObjectURL(link.href);
        });

        const search = document.getElementById("search");
        const matches = () => {
            const term = search.value.trim().toLowerCase();
            return nodes.map((node, index) => [node, index]).filter(([node]) => term && node.title.toLowerCase().includes(term)).map(([, index]) => index);
        };
        search.addEventListener("input", () => {
            const found = new Set(matches());
            const term = search.value.trim();
            nodeElements.forEach((element, index) => element.classList.toggle("match", found.has(index)));
            gallery.querySelectorAll(".card").forEach((card) => card.classList.toggle("hidden", term !== "" && !found.has(Number(card.dataset.index))));
        });
        search.addEventListener("keydown", (event) => {
            if (event.key !== "Enter") return;
            const [first] = matches();
            if (first !== undefined) select(first, true);
        });
    })();
</script>
</body>
